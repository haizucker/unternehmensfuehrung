<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KLR Lernplattform</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&family=Anton&display=swap">
<style>html{color-scheme:dark}body{margin:0;background:#06112f;color:#eef2ff;padding:18px 16px 70px}</style>
</head>
<body>
<div id="uf">
<style>
/* Layout: dunkle Lernplattform – Kopfzeile mit XP-Leiste, scrollbare Modul-Tabs, Inhaltsspalte max. 980px */
#uf{--bg:#06112f;--s1:#0b1a46;--s2:#11245c;--s3:#183078;--line:#2a4290;--tx:#eef2ff;--mu:#a8b5df;--ac:#3cc4f0;--ac2:#7fd9f7;--xp:#ff9e1b;--gold:#ffd23f;--ok:#3ddc97;--okbg:rgba(61,220,151,.13);--no:#ff6b6b;--nobg:rgba(255,107,107,.13);
--fd:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--fb:"Barlow",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--fm:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
color-scheme:dark;font-family:var(--fb);font-size:16px;line-height:1.55;color:var(--tx);background:var(--bg);max-width:980px;margin:0 auto;text-align:left}
#uf *{box-sizing:border-box}
#uf h2,#uf h3,#uf h4,#uf p,#uf ul,#uf ol,#uf figure{margin:0 0 .6em;padding:0}
#uf ul,#uf ol{padding-left:1.3em}#uf li{margin:.15em 0}
#uf h2{font-family:var(--fd);font-weight:700;font-size:1.9em;line-height:1.1;letter-spacing:.01em;text-wrap:balance}
#uf h3{font-family:var(--fd);font-weight:600;font-size:1.35em;line-height:1.2;color:var(--ac2);text-wrap:balance}
#uf h4{font-size:1em;font-weight:700}
#uf b,#uf strong{color:#fff}
#uf a{color:var(--ac2)}
#uf button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--s2);color:var(--tx);padding:.5em .95em;line-height:1.25;text-transform:none;letter-spacing:0;box-shadow:none;min-height:0;width:auto;margin:0}
#uf button:hover{border-color:var(--ac);background:var(--s3)}
#uf button:focus-visible,#uf input:focus-visible,#uf summary:focus-visible,#uf [tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#uf button[disabled]{opacity:.85;cursor:default}
#uf .btn-p{background:var(--ac);color:#04123a;border-color:var(--ac);font-weight:700}
#uf .btn-p:hover{background:var(--ac2);color:#04123a}
#uf .btn-x{background:var(--xp);color:#2a1500;border-color:var(--xp);font-weight:700}
#uf .btn-x:hover{background:#ffb54d;color:#2a1500}
#uf .small{font-size:.86em;color:var(--mu)}
#uf .num{font-family:var(--fm);font-variant-numeric:tabular-nums}
/* Kopf */
#uf .top{background:linear-gradient(160deg,#0f2a7a 0%,#0a1c55 55%,#081544 100%);border:1px solid var(--line);border-radius:18px;padding:20px 20px 16px;margin-bottom:12px;position:relative;overflow:hidden}
#uf .top::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(60,196,240,.25),transparent 70%);pointer-events:none}
#uf .top .eyebrow{font-family:var(--fd);text-transform:uppercase;letter-spacing:.14em;font-size:.82em;color:var(--ac2);font-weight:600}
#uf .top h2{font-size:2.3em;margin:.1em 0 .25em}
#uf .top p{color:var(--mu);margin:0}
#uf .hud{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:14px;position:relative;z-index:1}
#uf .lvl{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 260px}
#uf .lvl .badge{flex:0 0 auto;width:46px;height:46px;border-radius:12px;background:var(--xp);color:#2a1500;font-family:var(--fd);font-weight:800;font-size:1.5em;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(255,158,27,.25)}
#uf .lvl .meta{flex:1;min-width:0}
#uf .lvl .name{font-weight:700;font-size:.95em}
#uf .bar{height:10px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin-top:4px}
#uf .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--xp),var(--gold));transition:width .5s}
#uf .bar.blue i{background:linear-gradient(90deg,var(--ac),var(--ok))}
#uf .chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:.88em;white-space:nowrap}
#uf .chip b{font-family:var(--fm)}
#uf .tog{display:flex;align-items:center;gap:8px;font-size:.9em;cursor:pointer;user-select:none}
#uf .tog input{width:42px;height:24px;appearance:none;-webkit-appearance:none;background:var(--s3);border:1px solid var(--line);border-radius:99px;position:relative;cursor:pointer;margin:0;flex:0 0 auto}
#uf .tog input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--mu);transition:left .2s,background .2s}
#uf .tog input:checked{background:rgba(255,158,27,.35);border-color:var(--xp)}
#uf .tog input:checked::after{left:20px;background:var(--xp)}
#uf.nogame .g-only{display:none !important}
/* Tabs */
#uf .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding:8px 2px 10px;margin:0 0 14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
#uf .tabs button{flex:0 0 auto;border-radius:99px;font-size:.9em;padding:.45em .9em;white-space:nowrap}
#uf .tabs button[aria-selected="true"]{background:var(--ac);color:#04123a;border-color:var(--ac);font-weight:700}
#uf .tabs button .pc{font-family:var(--fm);font-size:.78em;opacity:.75;margin-left:5px}
#uf .panel{display:none}#uf .panel.on{display:block}
/* Bausteine */
#uf .intro{background:var(--s1);border:1px solid var(--line);border-left:4px solid var(--ac);border-radius:12px;padding:12px 14px;margin:0 0 14px;color:#dfe6ff}
#uf .modhead{display:flex;align-items:center;gap:12px;margin:0 0 10px;flex-wrap:wrap}
#uf .modhead .bar{flex:1 1 160px;margin:0}
#uf .modhead .pct{font-family:var(--fm);color:var(--ac2);font-weight:600}
#uf .card{background:var(--s1);border:1px solid var(--line);border-radius:14px;margin:0 0 10px;overflow:hidden}
#uf .card>.acc{width:100%;display:flex;align-items:center;gap:12px;border:0;border-radius:0;background:transparent;padding:13px 15px;text-align:left;font-weight:600;font-size:1.03em}
#uf .card>.acc:hover{background:var(--s2)}
#uf .card .n{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--s3);color:var(--ac2);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:700}
#uf .card.done .n{background:var(--ok);color:#03251a}
#uf .card .tt{flex:1;min-width:0}
#uf .card .chev{color:var(--mu);transition:transform .2s}
#uf .card.open .chev{transform:rotate(90deg)}
#uf .card .body{display:none;padding:4px 16px 16px;border-top:1px solid var(--line)}
#uf .card.open .body{display:block}
#uf .lab{display:block;font-family:var(--fd);font-size:.85em;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ac);margin:12px 0 4px}
#uf .fig{background:#0a1740;border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0;text-align:center;overflow-x:auto}
#uf .fig svg{width:100%;height:auto;max-width:640px;display:inline-block}
#uf .fig .cap{font-size:.8em;color:var(--mu);margin-top:6px}
#uf .formula{background:#0a1740;border:1px dashed var(--ac);border-radius:10px;padding:10px 12px;margin:10px 0;font-family:var(--fm);font-size:.92em;overflow-x:auto;white-space:nowrap}
#uf .formula div{margin:2px 0}
#uf details.deep{background:rgba(255,158,27,.07);border:1px solid rgba(255,158,27,.35);border-radius:10px;margin:12px 0}
#uf details.deep>summary{cursor:pointer;padding:10px 12px;font-weight:700;color:var(--xp);list-style:none}
#uf details.deep>summary::-webkit-details-marker{display:none}
#uf details.deep>summary::before{content:"+ "}#uf details.deep[open]>summary::before{content:"− "}
#uf details.deep .in{padding:0 14px 12px}
#uf .merk{border:1px dashed var(--gold);border-radius:8px;padding:8px 10px;margin:8px 0 2px;color:#fff3c4}
#uf .tip{background:rgba(60,196,240,.1);border-left:4px solid var(--ac);border-radius:8px;padding:9px 12px;margin:10px 0}
#uf .done-l{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:.92em;margin-top:12px;cursor:pointer}
#uf .done-l input{width:18px;height:18px;accent-color:var(--ok);margin:0}
#uf .scroll{overflow-x:auto;margin:8px 0}
#uf table.t{border-collapse:collapse;width:100%;font-size:.88em;min-width:420px}
#uf table.t th,#uf table.t td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
#uf table.t th{background:var(--s3);color:#fff;font-weight:600}
#uf table.t td.r,#uf table.t th.r{text-align:right;font-family:var(--fm);font-variant-numeric:tabular-nums}
#uf table.t tr.sum td{font-weight:700;background:rgba(60,196,240,.08)}
#uf .grid{display:grid;gap:8px}
#uf .tile{border-radius:10px;padding:10px;font-size:.9em;line-height:1.4;background:var(--s2);border:1px solid var(--line);text-align:left}
#uf .tile b{display:block;margin-bottom:2px;color:var(--ac2)}
#uf .flow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#uf .flow .st{flex:1 1 130px;max-width:210px;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.86em;text-align:left}
#uf .flow .st b{display:block;color:var(--ac2)}
#uf .flow .st i{font-style:normal;display:inline-block;background:var(--xp);color:#2a1500;border-radius:6px;width:20px;height:20px;text-align:center;line-height:20px;font-size:.8em;font-weight:700;margin-right:5px}
#uf .ab{border-bottom:1.5px dotted var(--ac2);cursor:help}
/* Rechnen */
#uf .calc{background:linear-gradient(180deg,#0e2163,#0b1a4c);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
#uf .calc .ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
#uf .calc .ch h4{font-family:var(--fd);font-size:1.2em;font-weight:700;margin:0}
#uf .calc .ch .xpb{font-size:.8em}
#uf .calc .task{margin:8px 0 10px;color:#e6ebff}
#uf .calc .task table{min-width:0}
#uf .fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin:8px 0}
#uf .fld{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
#uf .fld label{display:block;font-size:.84em;color:var(--mu);margin-bottom:4px}
#uf .fld .iw{display:flex;align-items:center;gap:6px}
#uf .fld input{flex:1;min-width:0;width:100%;background:#061238;border:1px solid var(--line);border-radius:8px;color:#fff;font-family:var(--fm);font-size:1em;padding:.45em .6em}
#uf .fld .u{color:var(--mu);font-family:var(--fm);font-size:.9em}
#uf .fld.ok{border-color:var(--ok);background:var(--okbg)}
#uf .fld.no{border-color:var(--no);background:var(--nobg)}
#uf .fld .fb{font-size:.82em;margin-top:4px;min-height:1em}
#uf .fld.ok .fb{color:var(--ok)}#uf .fld.no .fb{color:#ffb3b3}
#uf .cbtn{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
#uf .steps{display:none;margin-top:10px;background:#061238;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
#uf .steps.on{display:block}
#uf .steps ol{margin:0}
#uf .steps li{margin:.3em 0}
#uf .steps li.hid{display:none}
#uf .calcfilter{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
#uf .calcfilter button{border-radius:99px;font-size:.85em;padding:.35em .8em}
#uf .calcfilter button.on{background:var(--ac);color:#04123a;border-color:var(--ac);font-weight:700}
#uf .solved{color:var(--ok);font-size:.82em;font-weight:600}
/* Spiele */
#uf .games{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
#uf .gbtn{background:var(--s3);font-weight:600}
#uf .gbtn.won{border-color:var(--ok);color:var(--ok)}
#uf .gbtn.won::after{content:" ✓"}
#uf .modal{position:fixed;inset:0;z-index:1000;background:rgba(2,6,20,.72);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
#uf .modal[hidden]{display:none}
#uf .mbox{background:var(--s1);border:1px solid var(--line);border-radius:18px;width:100%;max-width:860px;padding:18px;position:relative;margin-top:8px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
#uf .mclose{position:absolute;top:10px;right:10px;width:40px;height:40px;padding:0;border-radius:99px;font-size:22px;line-height:1}
#uf .mbox h3{padding-right:46px}
#uf .gstat{display:flex;gap:14px;flex-wrap:wrap;font-size:.9em;color:var(--mu);margin:4px 0}
#uf .gstat b{color:#fff;font-family:var(--fm)}
#uf .mem{display:grid;grid-template-columns:repeat(var(--c,4),1fr);gap:8px;margin:10px 0}
#uf .mem button{min-height:92px;border-radius:12px;padding:8px;font-size:.86em;line-height:1.25;border:2px solid var(--line);background:repeating-linear-gradient(45deg,#13286a,#13286a 9px,#183078 9px,#183078 18px);color:transparent;display:flex;align-items:center;justify-content:center;text-align:center;word-break:break-word;hyphens:auto;transition:background .2s}
#uf .mem button.up{color:#fff}
#uf .mem button.up.a{background:rgba(255,158,27,.18);border-color:var(--xp);font-weight:700}
#uf .mem button.up.b{background:rgba(60,196,240,.15);border-color:var(--ac)}
#uf .mem button.match{background:var(--okbg) !important;border-color:var(--ok) !important;color:#d8ffef}
#uf .mem button.bad,#uf .pool button.bad,#uf .sortc.bad{border-color:var(--no) !important;animation:ufShake .35s}
@keyframes ufShake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#uf .win{background:var(--okbg);border:1px solid var(--ok);color:#d8ffef;border-radius:10px;padding:10px 12px;margin:8px 0;font-weight:600}
#uf .pool,#uf .doneord{display:grid;gap:6px;margin:8px 0}
#uf .pool button{text-align:left}
#uf .doneord div{background:var(--okbg);border:1px solid var(--ok);border-radius:8px;padding:6px 10px;font-size:.92em}
#uf .doneord div span{display:inline-block;background:var(--ok);color:#03251a;border-radius:6px;width:22px;height:22px;text-align:center;line-height:22px;font-size:.8em;font-weight:700;margin-right:6px}
#uf .sortitem{background:var(--s2);border:2px solid var(--xp);border-radius:12px;padding:14px;text-align:center;font-weight:700;font-size:1.08em;margin:10px 0}
#uf .sortcats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
#uf .sortc{padding:12px 10px;font-weight:600;border-radius:12px;text-align:center}
#uf .sortc.okf{border-color:var(--ok);background:var(--okbg)}
#uf .sortlog{font-size:.85em;color:var(--mu);margin-top:8px}
/* Quiz */
#uf .quiz{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0;background:var(--s1)}
#uf .q{margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
#uf .q:last-of-type{border-bottom:0}
#uf .q .qq{font-weight:600;margin-bottom:6px}
#uf .opts{display:grid;gap:6px}
#uf .opts button{text-align:left;width:100%}
#uf .opts button.ok{background:var(--okbg);border-color:var(--ok);color:#d8ffef}
#uf .opts button.no{background:var(--nobg);border-color:var(--no);color:#ffd6d6}
#uf .expl{display:none;font-size:.9em;margin-top:6px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.05);color:#dfe6ff}
#uf .expl.on{display:block}
#uf .score{font-weight:700;color:var(--ac2);margin:4px 0 10px}
/* Fortschritt / Badges */
#uf .dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin:0 0 14px}
#uf .dcard{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
#uf .dcard h4{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px;font-size:.95em}
#uf .dcard h4 span{font-family:var(--fm);color:var(--ac2)}
#uf .parts{display:flex;flex-wrap:wrap;gap:5px;font-size:.78em;margin-top:6px}
#uf .parts span{background:rgba(255,255,255,.07);border-radius:99px;padding:2px 8px;font-family:var(--fm)}
#uf .parts span.full{background:var(--okbg);color:var(--ok)}
#uf .big{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px}
#uf .big .p{font-family:var(--fd);font-size:3em;font-weight:800;line-height:1;color:var(--ac2)}
#uf .badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:0 0 14px}
#uf .bdg{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:var(--s1);opacity:.45;filter:grayscale(1)}
#uf .bdg.got{opacity:1;filter:none;border-color:var(--gold);background:linear-gradient(180deg,rgba(255,210,63,.13),rgba(255,210,63,.03))}
#uf .bdg .ic{width:44px;height:44px;margin:0 auto 6px;border-radius:50%;background:var(--gold);color:#2a1500;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:800;font-size:1.1em}
#uf .bdg b{display:block;font-size:.88em}
#uf .bdg span{font-size:.75em;color:var(--mu)}
#uf .toasts{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 60px);z-index:1100;display:grid;gap:6px;width:min(78vw,320px);pointer-events:none}
#uf .toast{background:#16307c;border:1px solid var(--xp);border-radius:12px;padding:8px 12px;font-size:.92em;box-shadow:0 12px 30px rgba(0,0,0,.45);font-weight:600;animation:ufIn .3s ease-out}
#uf .toast.gold{border-color:var(--gold);background:linear-gradient(90deg,#3a2a00,#16307c)}
@keyframes ufIn{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
#uf .fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:900;background:var(--xp);color:#2a1500;border:0;border-radius:99px;padding:12px 18px;font-weight:800;box-shadow:0 10px 28px rgba(255,158,27,.4)}
#uf .fab:hover{background:#ffb54d;color:#2a1500}
/* Karteikasten */
#uf .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
#uf .chips button{border-radius:99px;font-size:.84em;padding:.35em .8em}
#uf .chips button.on{background:var(--ac);color:#04123a;border-color:var(--ac);font-weight:700}
#uf .fc{perspective:1200px;margin:8px 0}
#uf .fcin{position:relative;min-height:230px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
#uf .fc.flip .fcin{transform:rotateY(180deg)}
#uf .fside{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:20px;display:flex;flex-direction:column;justify-content:center;overflow:auto}
#uf .front{background:linear-gradient(160deg,#173382,#0f2363);border:2px solid var(--xp);align-items:center;text-align:center}
#uf .front .q{font-family:var(--fd);font-size:1.5em;font-weight:700;color:#fff}
#uf .back{background:#0c1d4f;border:2px solid var(--ac);transform:rotateY(180deg)}
#uf .fside .meta{font-size:.74em;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
#uf .fcb{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
#uf .fcb .no{background:var(--nobg);border-color:var(--no);font-weight:700}
#uf .fcb .ok{background:var(--okbg);border-color:var(--ok);font-weight:700}
#uf .boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
#uf .boxes div{border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;font-size:.8em;background:var(--s2)}
#uf .boxes div b{display:block;font-size:1.5em;color:var(--ac2);font-family:var(--fm)}
#uf .boxes div.cur{border-color:var(--xp)}

(o.ticksY||[]).forEach(function(v){s+=Ln(L,sy(v),W-Rr,sy(v),"rgba(168,181,223,.15)",{w:1})+T(L-6,sy(v),fmtN(v),{fs:10.5,a:"end",c:K.mu});});
(o.ticksX||[]).forEach(function(v){s+=T(sx(v),H-B+14,fmtN(v),{fs:10.5,c:K.mu});});

var ABBR={

{id:"m1",tab:"1 Grundlagen",title:"Grundlagen und Abgrenzungsrechnung",intro:"Bevor gerechnet wird, muss klar sein, <b>welche</b> Zahlen in die KLR gehören. Die Abgrenzungsrechnung trennt das, was mit dem Betriebszweck zu tun hat (Kosten, Leistungen), von allem anderen (neutrale Aufwendungen und Erträge) und ergänzt kalkulatorische Kosten.",
topics:[
{t:"Das betriebliche Rechnungswesen",g:G.rw,what:"Das Rechnungswesen besteht aus vier Bereichen. Die <b>FiBu</b> dokumentiert alle Geschäftsvorfälle und ist gesetzlich vorgeschrieben (§ 238 HGB: jeder Kaufmann; Kleingewerbetreibende sind befreit). Die <b>KLR</b> ist eine interne Rechnung ohne gesetzliche Vorgaben und dient Kalkulation, Kostenkontrolle und Steuerung.",
deep:"<p>Merke den Unterschied <b>extern ↔ intern</b>: Die FiBu informiert Finanzamt, Banken, Lieferanten und Eigentümer und wird auf Konten geführt. Die KLR richtet sich an die Unternehmensleitung und wird meist in Tabellen geführt.</p><p>Die FiBu erfasst <b>alle</b> Aufwendungen und Erträge → <b>Unternehmensergebnis</b> (GuV). Die KLR erfasst nur <b>betriebsbedingte</b> Werte (Kosten und Leistungen) → <b>Betriebsergebnis</b>.</p><p><b>Grundsätze der KLR:</b> zweckgerichtet, verursachungsgerecht, wirtschaftlich, vergleichbar, vom Normalfall ausgehen, periodengerecht, aktuell.</p>",
merk:"FiBu = für draußen (Pflicht), KLR = für drinnen (Steuerung).",
kl:"Typische Frage: „Unterscheiden Sie FiBu und KLR.“ → extern/intern, alle Aufwendungen/nur Kosten, Unternehmens-/Betriebsergebnis, gesetzlich geregelt/frei."},
{t:"Die vier Begriffspaare",g:G.begriffe,what:"Das Rechnungswesen unterscheidet vier Paare, die jeweils eine andere Größe verändern: <b>Ein-/Auszahlung</b> (liquide Mittel), <b>Einnahme/Ausgabe</b> (Netto-Geldvermögen), <b>Ertrag/Aufwand</b> (Eigenkapital) und <b>Leistung/Kosten</b> (nur der betriebliche Teil).",
deep:"<p><b>Beispiel Wareneinkauf auf Ziel für 1.000 €:</b> Es ist eine <i>Ausgabe</i> (Verbindlichkeit steigt), aber noch keine <i>Auszahlung</i> (kein Geld geflossen). Erst beim Bezahlen folgt die Auszahlung.</p><p><b>Kauf einer Maschine bar:</b> Auszahlung und Ausgabe, aber kein Aufwand im Kaufjahr in voller Höhe – Aufwand entsteht erst über die Abschreibung.</p><p><b>Liquide Mittel</b> = Kasse + Bank. <b>Netto-Geldvermögen</b> = liquide Mittel + Forderungen − Verbindlichkeiten.</p>",
merk:"Zahlung = Geld fließt · Einnahme/Ausgabe = auch auf Ziel · Aufwand/Ertrag = Werteverzehr/-zuwachs · Kosten/Leistung = nur betrieblich."},
{t:"Aufwand und Kosten abgrenzen",g:G.aufw,what:"Nicht jeder Aufwand ist Kosten. <b>Neutraler Aufwand</b> hat nichts mit dem normalen Betrieb zu tun und wird herausgefiltert. Der <b>Zweckaufwand</b> wird zu Kosten: entweder in gleicher Höhe (<b>Grundkosten</b>) oder in anderer Höhe (<b>Anderskosten</b>). <b>Zusatzkosten</b> gibt es nur in der KLR.",
deep:"<p><b>Drei Arten neutraler Aufwand:</b> <i>betriebsfremd</i> (Spende an den Karnevalsverein), <i>periodenfremd</i> (Gewerbesteuer-Nachzahlung für Vorjahre), <i>außergewöhnlich</i> (Hochwasserschaden). Genauso gibt es neutrale Erträge: betriebsfremd (Lottogewinn, Mieterträge aus vermietetem Gebäude), periodenfremd (Steuerrückerstattung Vorjahr), außerordentlich (Gewinn aus dem Verkauf eines Gebäudes).</p><p><b>Grundkosten</b> (aufwandsgleich): Löhne, Gehälter, Versicherungsprämien, Energie.</p><p><b>Anderskosten</b> (aufwandsungleich): z. B. kalkulatorische Abschreibung – sie rechnet vom höheren <i>Wiederbeschaffungswert</i>, die bilanzielle vom Anschaffungswert.</p><p><b>Zusatzkosten</b> (aufwandslos): kalkulatorischer Unternehmerlohn, kalkulatorische Eigenkapitalzinsen, kalkulatorische Miete für eigene Räume.</p><p>Anders- und Zusatzkosten zusammen heißen <b>kalkulatorische Kosten</b>.</p>",
merk:"Neutral = weg damit. Grund = gleich. Anders = anders hoch. Zusatz = nur in der KLR.",
kl:"Sehr häufig: Geschäftsvorfälle zuordnen lassen. Frage dich: Betriebsbedingt? Richtige Periode? Normaler Ablauf? Dreimal ja → Zweckaufwand."},
{t:"Kalkulatorische Kosten",what:"Kalkulatorische Kosten machen die Kalkulation <b>vergleichbar und vollständig</b>: Sie berücksichtigen Werteverzehr, den die FiBu nicht oder anders erfasst.",
f:["Kalk. Zinsen = betriebsnotwendiges Kapital × kalk. Zinssatz","Betriebsnotw. Vermögen = Anlagevermögen (kalk. Restwerte) + Umlaufvermögen (kalk. Mittelwerte)","Betriebsnotw. Kapital = betriebsnotw. Vermögen − Abzugskapital","Wagnissatz = Ø Wagnisverluste ÷ Ø Bezugsgröße × 100","Wagniskosten = Wagnissatz × Bezugsgröße der Periode"],
deep:"<p><b>Kalk. Abschreibungen</b> orientieren sich am Wiederbeschaffungswert → meist höher als die bilanziellen.</p><p><b>Kalk. Zinsen</b>: Die FiBu kennt nur Fremdkapitalzinsen. Der Eigentümer erwartet aber auch eine Verzinsung seines Eigenkapitals. Deshalb werden Zinsen auf das <i>gesamte</i> betriebsnotwendige Kapital verrechnet. Nicht betriebsnotwendig sind z. B. vermietete Gebäude oder Wertpapiere. <b>Abzugskapital</b> = Kapital, das zinslos zur Verfügung steht: Lieferantenkredite ohne Skonto, Kundenanzahlungen.</p><p><b>Kalk. Miete</b> und <b>kalk. Unternehmerlohn</b> gibt es nur bei Einzelunternehmen und Personengesellschaften (der Inhaber bekommt kein Gehalt, seine Räume keine Miete). Maßstab: Gehalt eines Geschäftsführers in einem vergleichbaren Unternehmen.</p><p><b>Kalk. Wagnisse</b>: Nur <i>Einzelwagnisse</i> sind Kosten (vorhersehbar, aus Erfahrung berechenbar): Anlagewagnis (Brand, Fehlinvestition), Beständewagnis (Schwund, Verderb, Diebstahl), Gewährleistungswagnis (Garantie), Vertriebswagnis (Forderungsausfälle). Das <i>allgemeine Unternehmerwagnis</i> (Konjunktur, Nachfrageverschiebung) ist <b>kein</b> Kostenbestandteil – es wird über den Gewinn abgedeckt. Ist ein Wagnis versichert, zählt die Versicherungsprämie als Kosten, kein kalk. Wagnis.</p>",
ex:"Skript: AV 7,2 Mio. + UV 5,2 Mio. = 12,4 Mio. betriebsnotw. Vermögen − 0,9 Mio. Abzugskapital = 11,5 Mio. × 9 % = <b>1.035.000 € kalk. Zinsen</b>. Wagnis: 875.000 ÷ 35 Mio. = 2,5 % × 3 Mio. = <b>75.000 €</b>.",
merk:"Unternehmerwagnis = Gewinn. Einzelwagnis = Kosten.",
kl:"Rechenaufgaben zu kalk. Zinsen und Wagnissen findest du unten im Bereich „Rechnen“."},
{t:"Zweikreissystem und Ergebnistabelle",g:G.zwei,what:"Die <b>Ergebnistabelle</b> verbindet RK I (FiBu) und RK II (KLR). In der Mitte steht die Abgrenzungsrechnung mit zwei Teilen: <b>unternehmensbezogene Abgrenzung</b> (neutrale Aufwendungen/Erträge) und <b>kostenrechnerische Korrekturen</b> (betriebliche Aufwendungen werden durch verrechnete kalkulatorische Kosten ersetzt).",
f:["Gesamtergebnis (Unternehmensergebnis) = Erträge − Aufwendungen","Neutrales Ergebnis = neutrale Erträge − neutrale Aufwendungen (+ Ergebnis kostenrechn. Korrekturen)","Betriebsergebnis = Leistungen − Kosten","Gesamtergebnis = neutrales Ergebnis + Betriebsergebnis"],
deep:"<p><b>So liest du die Tabelle:</b> Jede GuV-Position wird geprüft. Neutrale Positionen wandern in die Spalten „neutrale Aufwendungen / Erträge“. Betriebliche Positionen wandern in „Kosten / Leistungen“.</p><p><b>Kostenrechnerische Korrekturen</b> (Skript-Beispiel kalk. Abschreibung): In der FiBu 650.000 € Abschreibungen, davon 40.000 € auf ein vermietetes Gebäude (neutral). Die restlichen 610.000 € stehen als „betriebliche Aufwendungen“, ersetzt durch 660.000 € „verrechnete Kosten“ (kalkulatorisch). Ergebnis der Korrektur: 610.000 − 660.000 = −50.000 €.</p><p><b>Kalk. Unternehmerlohn</b> (Zusatzkosten): In der FiBu steht nichts, in der KLR 300.000 € Kosten – das Betriebsergebnis sinkt, das neutrale Ergebnis steigt um denselben Betrag. Das Gesamtergebnis bleibt gleich!</p>",
ex:"Skript: Gewinn GuV 30.000 € (Ertrag 70.000 − Aufwand 40.000) − neutrales Ergebnis 25.000 € (40.000 − 15.000) = Betriebsergebnis 5.000 € (Leistungen 30.000 − Kosten 25.000).",
merk:"Kalkulatorische Kosten verschieben Ergebnis zwischen neutral und betrieblich – das Gesamtergebnis ändert sich nie.",
kl:"Rechne immer in drei Schritten: Gesamtergebnis → neutrales Ergebnis abziehen → Betriebsergebnis. Probe: neutral + betrieblich = gesamt."}
],

{id:"m2",tab:"2 Kostentheorie",title:"Kostentheorie und Break-even-Point",intro:"Wie verhalten sich Kosten, wenn sich die Menge ändert? Daraus folgt die wichtigste Frage jedes Händlers: <b>Ab welcher Menge verdiene ich Geld?</b>",
topics:[
{t:"Fixe und variable Kosten",g:G.costs,what:"<b>Variable Kosten</b> hängen von der Menge ab (Wareneinsatz, Verpackung, Transport). <b>Fixe Kosten</b> fallen unabhängig von der Menge an (Miete, Abschreibungen, Gehälter Festangestellter) – sie sind zeitabhängig.",
f:["K = Kf + Kv","Kv = kv · x","kf = Kf ÷ x","k (Stückkosten) = K ÷ x = kf + kv"],
deep:"<p><b>Schreibweise:</b> Großbuchstaben = Gesamtkosten (Kf, Kv, K), Kleinbuchstaben = Stückkosten (kf, kv, k). x = Menge.</p><p><b>Verhalten bei steigender Menge:</b> Kv steigt proportional, kv bleibt gleich. Kf bleibt gleich, kf sinkt – das ist die <b>Fixkostendegression</b>: Die Fixkosten verteilen sich auf mehr Stück.</p><p><b>Skript-Beispiel:</b> Druckerpatronen für 4,50 €/Stück, Fixkosten 1.200 €/Monat. Bei 200 Stück: K = 1.200 + 900 = 2.100 €, Stückkosten 10,50 €. Bei 1.000 Stück: K = 5.700 €, Stückkosten nur 5,70 €.</p><p><b>Wichtig:</b> Langfristig sind alle Kosten variabel (Miete kann gekündigt werden).</p>",
merk:"Groß = gesamt, klein = je Stück. Fix bleibt gesamt gleich, wird je Stück kleiner.",
kl:"Kurvenverläufe beschreiben können: Kf waagerecht, Kv als Gerade durch den Ursprung, K als Gerade parallel zu Kv, um Kf nach oben verschoben."},
{t:"Break-even-Point (Gewinnschwelle)",g:G.bep,what:"Der <b>Break-even-Point</b> (Gewinnschwelle, Nutzenschwelle) ist die Menge, bei der Erlöse und Kosten gleich sind – der Gewinn ist genau null. Ab der nächsten Einheit beginnt die Gewinnzone.",
f:["E = p · x","K = Kf + kv · x","E = K  →  p · x = Kf + kv · x","x(BEP) = Kf ÷ (p − kv) = Kf ÷ db","Umsatz am BEP = x(BEP) · p"],
deep:"<p><b>Logik:</b> Jedes verkaufte Stück bringt den <b>Stückdeckungsbeitrag</b> db = p − kv. Dieser „deckt“ nach und nach die Fixkosten. Sind alle Fixkosten gedeckt, ist der BEP erreicht.</p><p><b>Grafisch</b> ist der BEP der Schnittpunkt von Erlösgerade und Gesamtkostengerade.</p><p><b>Krumme Ergebnisse</b> (z. B. 533,3 Stück) rundet man <b>auf</b> – erst ab 534 Stück gibt es Gewinn.</p>",
merk:"BEP = Fixkosten geteilt durch Deckungsbeitrag je Stück.",
kl:"Immer zuerst db = p − kv ausrechnen, dann Kf ÷ db. Einheit nicht vergessen (Stück bzw. € beim Umsatz)."}
],

{id:"m3",tab:"3 Kostenarten",title:"Kostenartenrechnung",intro:"Die Kostenartenrechnung beantwortet die Frage: <b>Welche Kosten sind in der Periode entstanden?</b> Sie erfasst und ordnet sämtliche Kosten und ist die Datenbasis für Kostenstellen- und Kostenträgerrechnung.",
topics:[
{t:"Aufbau der Vollkostenrechnung",g:G.klr,what:"Die Vollkostenrechnung läuft in drei Stufen: <b>Kostenarten</b> (welche?), <b>Kostenstellen</b> (wo?), <b>Kostenträger</b> (wofür?). Einzelkosten gehen direkt auf den Kostenträger, Gemeinkosten über die Kostenstellen.",
deep:"<p><b>Aufgaben der Kostenartenrechnung:</b> sämtliche Kosten erfassen, klassifizieren, Daten bereitstellen, Kosten kontrollieren. Dazu gehört die Abgrenzung: Zweckaufwand übernehmen, Anders- und Zusatzkosten ergänzen, neutrale Aufwendungen ausbuchen.</p><p><b>Auswertung:</b> Entwicklung einer Kostenart im Zeitverlauf beobachten, Anteil einer Kostenart an den Gesamtkosten berechnen.</p>"},
{t:"Drei Arten, Kosten zu gliedern",what:"Kosten werden nach drei Kriterien eingeteilt: nach der <b>Art der verbrauchten Güter</b>, nach der <b>Zurechenbarkeit</b> (Einzel- oder Gemeinkosten) und nach dem <b>Verhalten bei Beschäftigungsänderung</b> (fix oder variabel).",
g:table(["Kriterium","Arten","Beispiele"],[["Art der Güter","Waren, Material, bezogene Leistungen, Personal, Sozialabgaben, Abschreibungen, Rechte/Dienste, Kommunikation, Beiträge","Geschenkkartons, Lagermiete, AG-Anteil SV, Leasingrate, IHK-Beitrag"],["Zurechenbarkeit","Einzelkosten (EK) / Gemeinkosten (GmK)","EK: Wareneinsatz, Bezugskosten · GmK: Geschäftsführergehalt, Miete, Energie"],["Verhalten","fix / variabel","fix: Miete, Gehälter · variabel: Wareneinsatz, Verpackung, Transport"]]),
deep:"<p><b>Einzelkosten</b> lassen sich einem Kostenträger (Artikel, Warengruppe) <b>direkt</b> zuordnen – z. B. der Wareneinsatz oder das Gehalt eines Mitarbeiters, der nur für eine Ware zuständig ist.</p><p><b>Gemeinkosten</b> entstehen für mehrere Leistungen gemeinsam (Miete, Strom, Geschäftsführung). Sie werden erst gesammelt und dann per <b>Verteilungsschlüssel</b> auf die Kostenträger verteilt – das passiert im BAB.</p><p>Im <b>Einzelhandel</b> heißen die Gemeinkosten <b>Handlungskosten</b>.</p><p>Achtung: Einzel/Gemein und fix/variabel sind zwei verschiedene Einteilungen! Der Wareneinsatz ist Einzelkosten <i>und</i> variabel, die Miete Gemeinkosten <i>und</i> fix.</p>",
merk:"Einzel = direkt zurechenbar. Gemein = per Schlüssel verteilt.",
kl:"Bei Zuordnungsaufgaben immer begründen: „… weil sie der Ware direkt zugerechnet werden können.“"}
],

{id:"m4",tab:"4 Kostenstellen",title:"Kostenstellenrechnung und BAB",intro:"Die Kostenstellenrechnung verteilt die <b>Gemeinkosten</b> möglichst verursachungsgerecht auf die Bereiche, in denen sie entstehen. Werkzeug ist der <b>Betriebsabrechnungsbogen (BAB)</b>. Am Ende stehen Zuschlagssätze für die Kalkulation.",
topics:[
{t:"Kostenstellen und Verteilungsschlüssel",what:"Eine <b>Kostenstelle</b> ist ein Ort im Betrieb, an dem Kosten entstehen. Im Einzelhandel bildet man sie nach Sortimentsbereichen (Textil, Lebensmittel), Funktionen (Einkauf, Lager, Verwaltung) oder Verkaufsstellen (Zentrale, Filialen).",
g:table(["Gemeinkostenart","Verteilung nach"],[["kalkulatorische Miete","Fläche (m²)"],["Energiekosten","Verbrauch in kWh oder Betriebsstunden"],["Abschreibungen","Anschaffungswerte"],["Zinsen","durchschnittlich gebundenes Kapital"],["Löhne / Gehälter","Mitarbeiter in der Kostenstelle"],["Sozialkosten","Verhältnis der Lohn- bzw. Gehaltskosten"]]),
deep:"<p><b>Primäre Kostenverteilung:</b> <i>Kostenstellen-Einzelkosten</i> werden direkt per Beleg zugeordnet (Werbekosten der Vertriebsstelle, Gehalt eines Mitarbeiters nur in einer Stelle). <i>Kostenstellen-Gemeinkosten</i> werden per Schlüssel verteilt (kalk. Miete, Versicherung, Unternehmerlohn).</p><p><b>Sekundäre Kostenverteilung</b> (Umlage, ILV): Kosten der Hilfskostenstellen werden auf die Hauptkostenstellen umgelegt.</p><p><b>Rechnen mit Schlüsseln:</b> Schlüssel 3:3:2 = 8 Teile. Bei 34.200 € ist ein Teil 4.275 € → 12.825 / 12.825 / 8.550 €.</p>",
merk:"Erst Teile addieren, dann Betrag ÷ Teile, dann × Teile je Stelle."},
{t:"BAB und Handlungskostenzuschlag",g:G.bab,what:"Im <b>BAB</b> werden alle Gemeinkosten (Handlungskosten) zeilenweise per Schlüssel auf die Kostenstellen verteilt und je Stelle summiert. Danach wird für jede Stelle der <b>Handlungskostenzuschlagssatz</b> berechnet.",
f:["HKZ (%) = Handlungskosten × 100 ÷ Wareneinsatz"],
deep:"<p><b>Skript-Beispiel Glas/Porzellan:</b> Handlungskosten 26.390 €, Wareneinsatz 85.000 € → 26.390 × 100 ÷ 85.000 = <b>31,05 %</b>. Das heißt: Auf jeden Euro Einstandspreis müssen 31 Cent Handlungskosten aufgeschlagen werden.</p><p><b>Einstufiger BAB</b>: nur Hauptkostenstellen, nur primäre Gemeinkosten. <b>Mehrstufiger BAB</b>: auch Hilfskostenstellen, mit innerbetrieblicher Leistungsverrechnung.</p>",
merk:"HKZ = Handlungskosten durch Wareneinsatz mal 100.",
kl:"Im BAB immer die Probe machen: Die Summe der Stellen muss der Gesamtsumme entsprechen."},
{t:"Innerbetriebliche Leistungsverrechnung: Anbau- und Stufenleiterverfahren",g:G.ilv,what:"Hilfskostenstellen (z. B. Reparatur, Strom) arbeiten für andere Stellen. Ihre Kosten werden umgelegt. Beim <b>Anbauverfahren</b> nur auf die Hauptkostenstellen, beim <b>Stufenleiterverfahren</b> auch auf nachgelagerte Hilfskostenstellen.",
f:["Anbau: Verrechnungssatz = primäre Kosten der Hilfsstelle ÷ Leistungen an die Hauptkostenstellen","Stufenleiter: Satz Stelle 1 = primäre Kosten ÷ Leistungen an nachgelagerte Stellen","Stufenleiter: Satz Stelle n = (primäre Kosten + Umlagen vorgelagerter Stellen) ÷ Leistungen an nachgelagerte Stellen"],
deep:"<p><b>Anbauverfahren (Skript):</b> Reparatur 64.680 €, insgesamt 1.600 h, davon 50 h an Strom → nicht berücksichtigt: 64.680 ÷ (1.600 − 50) = <b>41,73 €/h</b>. Strom 53.937 €, 600.000 kWh, davon 35.000 an Reparatur: 53.937 ÷ 565.000 = <b>0,095 €/kWh</b>. Nachteil: Die gegenseitigen Leistungen der Hilfsstellen werden ignoriert.</p><p><b>Stufenleiterverfahren (Skript):</b> Reparatur wird zuerst abgerechnet: 64.680 ÷ 1.600 h = <b>40,43 €/h</b> (auch die 50 h an Strom zählen). Strom erhält 50 h × 40,43 = 2.021 €. Neuer Satz Strom: (53.937 + 2.021) ÷ (600.000 − 35.000) = <b>0,099 €/kWh</b>. Leistungen an vorgelagerte Stellen (Strom → Reparatur) bleiben unberücksichtigt.</p><p>Es gibt außerdem das <b>Gleichungsverfahren</b> (gegenseitiger Leistungsaustausch) – im Skript nur genannt.</p>",
merk:"Anbau = nur an Hauptstellen. Stufenleiter = Treppe abwärts, nie zurück.",
kl:"Reihenfolge beachten: Beim Stufenleiterverfahren wird die Stelle zuerst abgerechnet, die am wenigsten von anderen Hilfsstellen empfängt."},
{t:"Abweichungen, Normal- und Istkosten",what:"Ist-Zuschlagssätze schwanken von Monat zu Monat. Für die Kalkulation nimmt man daher <b>Normal-Zuschlagssätze</b> (Durchschnitt der Vergangenheit). In der Nachkalkulation zeigt sich dann eine <b>Kostenüber- oder -unterdeckung</b>.",
f:["Überdeckung: Normalkosten > Istkosten","Unterdeckung: Normalkosten < Istkosten"],
deep:"<p><b>Drei Abweichungsarten:</b> <i>Preisabweichungen</i> (Miete, Gehälter steigen), <i>Beschäftigungsabweichungen</i> (sinkt der Wareneinsatz, steigt der Zuschlagssatz) und <i>Verbrauchsabweichungen</i> (mehr Personal, Energie als normal). Nur die Verbrauchsabweichung liegt in der Verantwortung der Kostenstellenleitung.</p><p><b>Beispiel Kostenträgerzeitrechnung (Skript):</b> Tische: Normal-HKZ 72 % auf 480.000 € = 345.600 €, Ist 75 % = 360.000 € → Unterdeckung 14.400 € (zu wenig einkalkuliert). Stühle: Normal 68 % = 187.680 €, Ist 64 % = 176.640 € → Überdeckung 11.040 €.</p>",
merk:"Überdeckung = mehr einkalkuliert als verbraucht (gut). Unterdeckung = zu wenig einkalkuliert (schlecht)."}
],

{id:"m5",tab:"5 Kalkulation",title:"Kostenträgerrechnung und Handelskalkulation",intro:"Die Kostenträgerrechnung beantwortet: <b>Wofür</b> sind die Kosten entstanden? Sie ermittelt Selbstkosten und Verkaufspreise. Im Handel heißt das: <b>Kalkulation</b> – vorwärts, rückwärts oder als Differenz.",
topics:[
{t:"Das Kalkulationsschema",g:G.schema,what:"Das Schema besteht aus drei Teilen: <b>Bezugskalkulation</b> (bis Einstandspreis), <b>Selbstkosten</b> (+ Handlungskosten) und <b>Verkaufskalkulation</b> (bis Bruttoverkaufspreis).",
deep:"<p><b>„Vom Hundert“ und „im Hundert“</b> – das ist der häufigste Fehler!</p><p><b>Vom Hundert</b> (Basis = 100 %, steht oben): Liefererrabatt, Liefererskonto, HKZ, Gewinn, USt. Rechnung: Betrag × Prozentsatz.</p><p><b>Im Hundert</b> (Basis steht unten, das Ergebnis ist 100 %): Kundenskonto und Provision beziehen sich auf den Zielverkaufspreis, der Kundenrabatt auf den Nettoverkaufspreis. Rechnung vorwärts: BVP ÷ (100 % − Skonto %) = ZVP. Beispiel: 7,95 ÷ 0,96 = 8,28 €.</p><p><b>Bezugskosten</b> sind ein fester Betrag (Fracht, Verpackung, Versicherung), keine Prozente.</p>",
merk:"Kunde bekommt Skonto und Rabatt vom späteren Preis → im Hundert dividieren!",
kl:"Rechne Schritt für Schritt und runde nach jedem Schritt auf zwei Nachkommastellen – so macht es auch das Skript."},
{t:"Bezugskalkulation und Angebotsvergleich",what:"Mit der <b>Bezugskalkulation</b> wird der Einstandspreis (Bezugspreis) ermittelt. Sie dient vor allem dem <b>Vergleich von Angeboten</b>: Entscheidend ist nicht der niedrigste Listenpreis, sondern der niedrigste Bezugspreis.",
g:table(["","Angebot I","Angebot II","Angebot III"],[["Listeneinkaufspreis","30.000","35.000","30.000"],["− Liefererrabatt","1.500","3.500","1.500"],["= Zieleinkaufspreis","28.500","31.500","28.500"],["− Liefererskonto","570","630","285"],["= Bareinkaufspreis","27.930","30.870","28.215"],["+ Bezugskosten","2.570","0","1.785"],["= Bezugspreis","30.500","30.870","30.000"],["Bezugspreis je Stück (5.000 Stück)","6,10","6,17","<b>6,00 → Rang 1</b>"]],[1,2,3]),
deep:"<p>Im Skript gewinnt Angebot III – trotz gleichem Listenpreis wie I, weil die Bezugskosten niedriger sind. Angebot II hat zwar keine Bezugskosten, aber den höchsten Listenpreis.</p><p>Neben dem Preis zählen in der Praxis auch Qualität, Lieferzeit, Zuverlässigkeit und Service (qualitativer Angebotsvergleich).</p>"},
{t:"Vorwärts-, Rückwärts- und Differenzkalkulation",what:"<b>Vorwärts</b> (progressiv): vom Einkaufspreis zum Verkaufspreis. <b>Rückwärts</b> (retrograd): vom Marktpreis zum höchstmöglichen Einkaufspreis. <b>Differenz</b>: Einkaufs- und Verkaufspreis stehen fest, gesucht ist der Gewinn.",
f:["Vorwärts: + vom Hundert (×), + im Hundert (÷ (1 − p))","Rückwärts: alles umgekehrt – im Hundert × (1 − p), vom Hundert ÷ (1 + p)","Differenz: Gewinn = BVP − SK; Gewinnzuschlag % = Gewinn × 100 ÷ SK"],
deep:"<p><b>Vorwärts (Skript):</b> EP 6,00 · HKZ 25 % (100.000 ÷ 400.000) → SK 7,50 · Gewinn 6 % → BVP 7,95 · Kundenskonto 4 % im Hundert → ZVP 8,28 · Rabatt 10 % im Hundert → NVP 9,20 · USt 19 % → 10,95 €.</p><p><b>Rückwärts (Skript):</b> Marktpreis netto 8,80 − Rabatt 10 % = 7,92 − Skonto 4 % = 7,60 ÷ 1,06 = SK 7,17 ÷ 1,25 = Bezugspreis 5,74 − Bezugskosten 0,36 = 5,38 ÷ 0,99 = ZEP 5,43 ÷ 0,95 = LEP 5,72 €.</p><p><b>Wichtig beim Rückwärtsrechnen:</b> Rabatt und Skonto des Kunden werden jetzt <i>vom Hundert</i> abgezogen (sie sind vom höheren Preis berechnet). Gewinn, HKZ, Liefererskonto und -rabatt werden <i>herausgerechnet</i> (Division).</p><p><b>Differenzkalkulation:</b> Von oben bis zu den Selbstkosten vorwärts, von unten bis zum Barverkaufspreis rückwärts. Die Differenz ist der Gewinn.</p>",
merk:"Rückwärts heißt: Plus wird zu geteilt, „im Hundert“ wird zu „vom Hundert“.",
kl:"Bei Rückwärtsaufgaben zuerst die Richtung jeder Position überlegen und ins Schema schreiben, dann rechnen."},
{t:"Verkürzte Kalkulation: Zuschlag, Faktor, Spanne, Abschlag",g:G.verk,what:"Statt jedes Mal das ganze Schema zu rechnen, nutzt der Handel feste Kennzahlen: <b>Kalkulationszuschlag</b> und <b>Kalkulationsfaktor</b> (vorwärts vom Einstandspreis), <b>Handelsspanne</b> und <b>Kalkulationsabschlag</b> (rückwärts vom Verkaufspreis).",
f:["Kalkulationszuschlag (%) = (BVP − EP) × 100 ÷ EP","Kalkulationsfaktor = BVP ÷ EP","Kalkulationsabschlag (%) = (BVP − EP) × 100 ÷ BVP","Handelsspanne (%) = (NVP − EP) × 100 ÷ NVP","(BVP = Bruttoverkaufspreis, EP = Einstandspreis, NVP = Nettoverkaufspreis)"],
deep:"<p><b>Zusammenhang:</b> Kalkulationsfaktor = 1 + Kalkulationszuschlag ÷ 100. Bei 20 % Zuschlag ist der Faktor 1,2.</p><p><b>Zuschlag vs. Spanne:</b> Beide messen denselben Euro-Betrag, aber mit anderer Basis. Zuschlag auf den Einstandspreis, Spanne auf den Verkaufspreis. Deshalb ist die Spanne immer kleiner: 20 € von 100 € sind 20 %, 20 € von 120 € nur 16,7 %.</p><p><b>Achtung Skript:</b> Kalkulationszuschlag, -faktor und -abschlag werden hier mit dem <b>Brutto</b>verkaufspreis berechnet, die Handelsspanne mit dem <b>Netto</b>verkaufspreis. Teilweise wird auch beim Zuschlag der Nettopreis verwendet – lies die Aufgabe genau.</p>",
merk:"Zuschlag schaut nach oben (vom EK), Spanne schaut nach unten (vom VK)."},
{t:"Vor-, Zwischen- und Nachkalkulation",what:"Nach dem Zeitpunkt unterscheidet man: <b>Vorkalkulation</b> (vor der Leistung, für Angebote), <b>Zwischenkalkulation</b> (während, zur Kontrolle) und <b>Nachkalkulation</b> (danach, tatsächliche Kosten). Der Vergleich zeigt Über- oder Unterdeckungen.",
deep:"<p><b>Skript-Beispiel:</b> Vorkalkulation mit Normal-HKZ 68 % auf 5.500 € = 3.740 €, Selbstkosten 9.240 €, Gewinn 20 % = 1.848 €. Nachkalkulation: Wareneinsatz 5.600 €, Ist-HKZ 64 % = 3.584 €, Selbstkosten 9.184 €. Bei gleichem Barverkaufspreis (11.088 €) steigt der tatsächliche Gewinn auf 1.904 € (20,73 %).</p><p><b>Kostenträgerzeitrechnung:</b> Für eine Periode werden Umsatzerlöse und Selbstkosten je Warengruppe gegenübergestellt. Umsatzergebnis (mit Normalkosten) ± Über-/Unterdeckung = Betriebsergebnis.</p>"}
],

{id:"m6",tab:"6 Teilkosten",title:"Teilkostenrechnung und Entscheidungen",intro:"Die Vollkostenrechnung verteilt <b>alle</b> Kosten – auch die Fixkosten – über Zuschläge. Das führt bei schwankenden Mengen zu falschen Ergebnissen. Die <b>Teilkostenrechnung</b> (Deckungsbeitragsrechnung) trennt fixe und variable Kosten und liefert bessere Entscheidungsgrundlagen.",
topics:[
{t:"Der Deckungsbeitrag",g:G.db,what:"Der <b>Deckungsbeitrag</b> ist die Differenz zwischen Erlösen und variablen Kosten. Er steht zur Deckung der Fixkosten zur Verfügung; was danach übrig bleibt, ist Gewinn.",
f:["DB = Erlöse − variable Kosten","db = p − kv (je Stück)","Betriebsergebnis = DB − Fixkosten"],
deep:"<p>Ein Produkt mit <b>positivem DB</b> trägt etwas zur Deckung der Fixkosten bei – selbst wenn es nach Vollkosten „Verlust“ macht. Deshalb ist es oft richtig, ein solches Produkt <b>nicht</b> auszulisten.</p><p>Im Handel sind die variablen Kosten vor allem der <b>Wareneinsatz</b> und sonstige variable Kosten (z. B. Verpackung, Provisionen).</p>",
merk:"Erst die variablen Kosten, dann die Fixkosten decken – Rest ist Gewinn."},
{t:"Einstufige und mehrstufige Deckungsbeitragsrechnung",g:G.mehr,what:"Die <b>einstufige</b> DB-Rechnung (Direct Costing) zieht die Fixkosten als <b>einen Block</b> vom Gesamt-DB ab. Die <b>mehrstufige</b> (Fixkostendeckungsrechnung) ordnet die Fixkosten Stufe für Stufe zu: Produkt → Produktgruppe → Bereich → Unternehmen.",
deep:"<p><b>Einstufig (Skript):</b> Umsatz 540.000 − Wareneinsatz 400.000 − sonstige variable Kosten 45.000 = DB 95.000 − Fixkosten 65.000 = Betriebsergebnis <b>30.000 €</b>.</p><p><b>Fixkostenstufen:</b> <i>Produktfixkosten</i> (Lizenzgebühren), <i>Produktgruppenfixkosten</i> (gemeinsame Werbung einer Gruppe), <i>Bereichsfixkosten</i> (Raumkosten, Meisterlöhne), <i>Unternehmensfixkosten</i> (Geschäftsführung).</p><p><b>Vorteil mehrstufig:</b> Man sieht genau, welche Warengruppe welche Fixkosten deckt. In der Tabelle hat Warengruppe A einen positiven DB I (14.000), aber einen negativen DB II (−1.000): Sie deckt ihre eigenen Fixkosten nicht.</p>",
kl:"Wichtig zum Erklären: Warum ist A trotz negativem DB II nicht automatisch auszulisten? Der DB I ist positiv – ohne A würden 14.000 € Deckungsbeitrag fehlen, solange die Warengruppen-Fixkosten nicht abbaubar sind."},
{t:"Vollkosten- vs. Teilkostenrechnung",what:"Die Vollkostenrechnung „proportionalisiert“ Fixkosten über Zuschlagssätze. Sinkt die Menge, werden zu wenig Fixkosten verrechnet (<b>Unterdeckung</b>); steigt sie, zu viele (<b>Überdeckung</b>). Das Ergebnis der Vollkostenrechnung stimmt dann nicht.",
g:table(["Absatz","Vollkosten-Ergebnis","Teilkosten-Ergebnis","Problem"],[["600 Stück","+3.600 € (scheinbar Gewinn)","30.000 − 14.400 − 20.000 = −4.400 €","Fixkosten unterdeckt"],["1.000 Stück (Plan)","+6.000 €","+6.000 €","stimmt"],["1.200 Stück","+7.200 €","60.000 − 28.800 − 20.000 = +11.200 €","Fixkosten überdeckt"]]),
deep:"<p><b>Skript-Beispiel:</b> Wareneinsatz 24 €/Stück, HKZ 83,33 % (= 20 €, alle Gemeinkosten fix, Plan 1.000 Stück → Fixkosten 20.000 €), Selbstkosten 44 €, Preis 50 €.</p><p>Die Vollkostenrechnung rechnet bei 600 Stück: 600 × (50 − 44) = 3.600 € Gewinn. Tatsächlich fallen aber die vollen 20.000 € Fixkosten an → Verlust 4.400 €.</p>",
merk:"Fixkosten bleiben fix – egal, was der Zuschlagssatz behauptet."},
{t:"Preisuntergrenzen",g:G.pug,what:"Die <b>kurzfristige Preisuntergrenze</b> liegt bei den variablen Stückkosten (DB = 0). Die <b>langfristige</b> liegt bei den vollen Stückkosten (Selbstkosten), denn auf Dauer müssen auch alle Fixkosten gedeckt sein.",
f:["kurzfristige PUG = kv","langfristige PUG = kv + kf = Selbstkosten je Stück"],
deep:"<p><b>Skript-Beispiel:</b> 6.000 Stück/Monat, Preis 220 €, variable Kosten 720.000 €, Fixkosten 180.000 €. Absatz sinkt vorübergehend um 1.000 Stück. Kurzfristige PUG: 720.000 ÷ 6.000 = <b>120 €</b>. Ist der Rückgang dauerhaft: kv 120 € + kf 180.000 ÷ 5.000 = 36 € → langfristige PUG <b>156 €</b>.</p><p>Beachte: Für die langfristige PUG werden die Fixkosten auf die <b>neue</b> Menge verteilt.</p><p>Unter den Einstandspreis darf ein Händler nach Wettbewerbsrecht nicht dauerhaft verkaufen (Verbot des Verkaufs unter Einstandspreis für marktmächtige Unternehmen).</p>",
merk:"Kurz = nur variable Kosten decken. Lang = alles decken."},
{t:"Engpassplanung: relativer Deckungsbeitrag",what:"Ohne Engpass gilt: Produkte nach dem <b>absoluten</b> Stück-DB reihen. Gibt es einen Engpass (Maschinenzeit, Verkaufsfläche), entscheidet der <b>relative Deckungsbeitrag</b>: DB je Einheit des knappen Faktors.",
f:["relativer DB = Stück-DB ÷ Engpassbeanspruchung je Stück","Handel: Stück-DB ÷ Verkaufsfläche oder Stück-DB ÷ Umsatz"],
g:table(["Gehäuse","Stück-DB","Montagezeit","relativer DB"],[["G I","27,36 €","5 min","5,472 €/min"],["G II","15,19 €","3 min","5,063 €/min"],["G III","38,08 €","6 min","6,347 €/min"],["G IV","16,70 €","4 min","4,175 €/min"]],[1,2,3]),
deep:"<p>Ohne Engpass: G III – G I – G IV – G II (nach absolutem DB). Mit Engpass Montage: <b>G III – G I – G II – G IV</b> (nach relativem DB). G II rückt vor, weil es wenig Montagezeit braucht.</p><p><b>Werbebudget-Methoden</b> (Skript): umsatzbezogen, deckungsbeitragsbezogen, als Residualgröße der Gewinnplanung, wettbewerbsorientiert, zielorientiert.</p>"}
],

{id:"m7",tab:"7 Controlling",title:"Controlling und Controllinginstrumente",intro:"Controlling heißt nicht nur „kontrollieren“, sondern <b>steuern</b> (to control). Der Controller ist der <b>Lotse</b> oder Bergführer: Die Geschäftsleitung trägt die Verantwortung, das Controlling macht das Ergebnis transparent.",
topics:[
{t:"Controlling-Regelkreis",g:G.regel,what:"Controlling hat vier Grundfunktionen: <b>Planung, Kontrolle, Information, Steuerung</b>. Im Regelkreis werden Ziele geplant (Soll), umgesetzt (Ist), verglichen (Soll-Ist) und bei Abweichungen korrigiert.",
deep:"<p><b>Strategisches Controlling</b>: langfristig, Umwelt und Unternehmen, Chancen/Risiken und Stärken/Schwächen, Ziel Existenzsicherung – „die richtigen Dinge machen“.</p><p><b>Operatives Controlling</b>: kurzfristig, das Unternehmen selbst, Aufwand/Ertrag und Kosten/Leistungen, Ziele Wirtschaftlichkeit, Gewinn, Rentabilität – „die Dinge richtig machen“.</p>",merk:"Strategisch = die richtigen Dinge tun. Operativ = die Dinge richtig tun."},
{t:"Instrumente: SWOT und GAP-Analyse",g:G.gapC,what:"Die <b>SWOT-Analyse</b> verbindet die interne Stärken-Schwächen-Analyse mit der externen Chancen-Risiken-Analyse. Die <b>GAP-Analyse</b> zeigt Lücken zwischen erwarteter und möglicher Entwicklung.",
deep:"<p><b>Stärken-Schwächen-Analyse</b>: Vergleich mit Wettbewerbern (Marktführer, Branchendurchschnitt) in Marktleistung, Preis, Marketing, Finanzen, Kosten, Personal → Stärken-Schwächen-Profil.</p><p><b>Chancen-Risiken-Analyse</b>: wirtschaftliches, gesellschaftliches, technologisches, rechtliches, politisches und ökologisches Umfeld.</p><p><b>GAP</b>: <i>Basisgeschäft</i> (Plan mit bisherigen Produkten/Märkten), <i>potenzielles Basisgeschäft</i> (bisherige Märkte optimal bearbeitet), <i>strategisches Potenzial</i> (mit neuen Produkten/Märkten). Die <b>operative Lücke</b> schließt man durch Optimierung (Öffnungszeiten, Schulung, Werbung), die <b>strategische Lücke</b> durch neue Produkte, Wege, Standorte (Skript-Beispiel Bäckerei: Hauslieferung, Stand am Wochenmarkt, Stehcafé).</p>"},
{t:"Instrumente: Lebenszyklus, Erfahrungskurve, BCG-Matrix",g:G.bcg+G.erf,what:"Die <b>BCG-Matrix</b> ordnet SGE nach Marktwachstum (→ Lebenszyklus) und relativem Marktanteil (→ Erfahrungskurve) und leitet <b>Normstrategien</b> ab. Ziel: ein ausgewogenes Produktprogramm.",
f:["relativer Marktanteil = eigener Marktanteil ÷ Marktanteil des stärksten Konkurrenten","Erfahrungskurve: Verdopplung der kumulierten Menge → Stückkosten −20 bis −30 %"],
deep:"<p><b>Stars</b>: wachsende Märkte, hoher Anteil → investieren; sie finanzieren sich selbst und sind die Cash-Lieferanten von morgen. <b>Cash Cows</b>: gesättigte Märkte, hoher Anteil → abschöpfen; Überschüsse fließen in Stars und Question Marks. <b>Poor Dogs</b>: geringer Anteil, geringes Wachstum → Desinvestition (Verkauf, Stilllegung). <b>Question Marks</b>: hohes Wachstum, geringer Anteil → offensiv ausbauen oder zurückziehen.</p><p><b>Erfahrungskurve</b>: Wer früh viel produziert, hat Kostenvorteile (Halbleiter sogar 40–50 %). Deshalb lohnt ein hoher Marktanteil.</p>"},
{t:"Instrumente: Balanced Scorecard und Benchmarking",g:G.bsc,what:"Die <b>Balanced Scorecard</b> (Kaplan/Norton) übersetzt Vision und Strategie in Ziele, Kennzahlen, Zielwerte und Maßnahmen für <b>vier Perspektiven</b>. <b>Benchmarking</b> vergleicht sich mit dem Klassenbesten.",
deep:"<p><b>BSC</b> heißt „ausgewogen“, weil sie neben Finanzkennzahlen auch nicht-monetäre Kennzahlen nutzt: Finanzen, Kunden, interne Prozesse, Lernen & Entwicklung (Mitarbeiter-/Potenzialperspektive).</p><p><b>Benchmarking-Arten</b>: intern (Filialen untereinander), wettbewerbsorientiert (direkte Mitbewerber), branchenfremd (Prozesse wie Kommissionierung mit anderen Branchen). Motto: „nicht kopieren, sondern kapieren“. Vorteile: Schwachstellen erkennen, Ideen gewinnen, Motivation. Nachteile: Daten schwer zu bekommen, Kennzahlen müssen gleich ermittelt sein, hoher Aufwand.</p>"},
{t:"Instrumente: ABC-Analyse, Nutzwertanalyse, Wertanalyse",g:G.abc,what:"Die <b>ABC-Analyse</b> trennt Wesentliches von Unwesentlichem: Wenige A-Artikel machen den Großteil des Werts aus. Die <b>Nutzwertanalyse</b> bewertet Alternativen mit gewichteten Kriterien. Die <b>Wertanalyse</b> optimiert Nutzen im Verhältnis zu Kosten.",
deep:"<p><b>ABC-Vorgehen:</b> 1. Jahresverbrauchswert je Artikel (Menge × Einstandspreis), 2. absteigend sortieren, 3. Anteil am Gesamtwert, 4. kumulieren, 5. Grenzen festlegen (A 70–85 %, B 10–25 %, C 5–10 % des Werts).</p><p><b>Umgang:</b> A-Artikel intensiv (Marktanalyse, Preisverhandlungen, Skonto nutzen, niedrige Sicherheitsbestände, genaue Kontrolle). C-Artikel vereinfacht (Bündelung, Rahmenverträge, höhere Sicherheitsbestände, Lieferant füllt auf).</p><p><b>Wertanalyse:</b> Wert = Nutzen für den Kunden ÷ Kosten. Funktionen analysieren, aus Kundensicht bewerten, Kosten je Funktion ermitteln.</p>"}
],

{id:"rm",tab:"Risikomanagement",title:"Risikomanagement",intro:"Ein <b>Risiko</b> ist die Gefahr, durch zukünftige, ungewisse externe und interne Störungen ein beabsichtigtes Ziel zu verfehlen. <b>Risikomanagement</b> heißt, Risiken systematisch zu identifizieren, zu bewerten, zu bewältigen und zu überwachen. Wesentliches Ziel: die <b>langfristige Sicherung der Unternehmensexistenz</b>.",
topics:[
{t:"Risiko, Risikoquellen und rechtlicher Rahmen",what:"Risiken entstehen <b>extern</b> (Gesetzgebung, gesellschaftliche Entwicklungen, Konjunktur, Wettbewerb) und <b>intern</b> (Managementfehler, Kapitalstruktur, Qualifikation und Motivation der Mitarbeiter). Mehrere Gesetze und Normen verlangen ein Risikomanagement.",
g:table(["Regelung","Kern"],[["KonTraG","Gesetz zur Kontrolle und Transparenz – Risikofrüherkennung"],["§ 91 Abs. 2 AktG","Vorstand muss ein Überwachungssystem einrichten"],["§ 317 HGB, IDW PS 340","Prüfung des Risikofrüherkennungssystems durch den Abschlussprüfer"],["DCGK","Empfehlungen guter Unternehmensführung"],["BilMoG, Sarbanes-Oxley-Act","Bilanzrecht, US-Regeln für börsennotierte Unternehmen"],["Basel II/III, MaRisk","Vorschriften für Banken"],["DIN ISO 31000","internationale Norm für Risikomanagement"]]),
deep:"<p><b>Externe Risikoquellen:</b> Gesetzesverschärfungen, verändertes Kaufverhalten, Konjunktureinbruch, Konkurrenzdruck, Preisverfall.</p><p><b>Interne Risikoquellen:</b> Fehlentscheidungen (Modernisierung, Produktpolitik, Vertriebsorganisation), Eigenkapitalbasis/Kapitalstruktur, Qualifikation und Motivation der Mitarbeiter.</p><p>Unternehmensziele, die gefährdet sein können: eine bestimmte Rendite, eine Erhöhung des Marktanteils.</p>",
merk:"Risiko = Ziel verfehlen. Risikomanagement = Existenz sichern."},
{t:"Corporate Governance und Compliance",g:G.cg,what:"<b>Corporate Governance</b> bedeutet verantwortungsvolle, transparente Unternehmensführung. <b>Corporate Compliance</b> umfasst alle Maßnahmen, um Verstöße gegen Recht, gesellschaftliche Werte und interne Regeln zu vermeiden.",
deep:"<p>Anlass waren Skandale: Bilanz-, Umwelt-, Bestechungs-, Daten- und Qualitätsskandale.</p><p><b>Shareholder-Ansatz</b> (angloamerikanisch): Beziehung Aktionäre ↔ Vorstand/Aufsichtsrat, Ziel Steigerung des Unternehmenswerts. <b>Stakeholder-Ansatz</b> (kontinentaleuropäisch): alle Anspruchsgruppen – Mitarbeiter, Kunden, Geschäftspartner –, Ziel hoher Wert <i>und</i> langfristige, nachhaltige Existenz.</p><p><b>Ziele der CG:</b> Vertrauen in die Unternehmensführung stärken, Funktionsfähigkeit der Märkte, leichterer Zugang zu Kapital und geringere Kapitalkosten, Zusammenarbeit von Leitung und Überwachung, sichere Arbeitsplätze, Attraktivität für Investoren.</p><p><b>DCGK:</b> gesetzliche Vorschriften + <i>Empfehlungen</i> („soll“) + <i>Anregungen</i> („sollte“). Über die <b>Entsprechenserklärung nach § 161 AktG</b> gilt <b>„Comply or Explain“</b>: Abweichungen von Empfehlungen (nicht von Anregungen) müssen jährlich begründet und veröffentlicht werden.</p>",
merk:"Governance = gut führen. Compliance = Regeln einhalten. Comply or explain = befolgen oder begründen.",
kl:"Häufig gefragt: Unterschied Shareholder- und Stakeholder-Ansatz sowie „Comply or Explain“ erklären."},
{t:"Der Risikomanagementprozess",g:G.rmProc,what:"Risikomanagement ist ein <b>Kreislauf aus vier Schritten</b>: Identifikation, Bewertung, Bewältigung und Überwachung/Reporting. Die Überwachung ist laufend – keine Endkontrolle.",
deep:"<p><b>1. Identifikation:</b> Welche Risiken gibt es? Methoden: SWOT-Analyse, Befragungen/Delphi-Methode, Brainstorming, Mindmap, GAP-Analyse, Portfolio-Analyse, Kennzahlenanalyse.</p><p><b>2. Bewertung:</b> Wie wahrscheinlich, wie teuer? Risikoinventar, Risikomatrix.</p><p><b>3. Bewältigung:</b> Was tun wir? Vermeiden, vermindern, überwälzen, diversifizieren oder übernehmen.</p><p><b>4. Überwachung/Reporting:</b> laufend prüfen, ob neue Risiken hinzukommen und ob die Maßnahmen wirken.</p>",
merk:"Finden → Bewerten → Handeln → Beobachten (und wieder von vorn)."},
{t:"Risikofelder",g:G.rmFelder,what:"Risiken werden in <b>interne</b> und <b>externe Risikofelder</b> eingeteilt. Diese Struktur hilft, bei der Identifikation nichts zu übersehen.",
deep:"<p><b>Strategische Risiken</b> stecken in allen langfristigen Entscheidungen: falsche Ziele, fehlende Strategie, Chancen nicht genutzt; im Mitarbeiterbereich mangelnde Qualifikation/Motivation; ungeeignete Organisation; Informationsquellen nicht genutzt; falsches Sortiment, falsche Lagerpolitik.</p><p><b>Risiken aus Corporate Governance</b>: Führungsstil, Betriebsklima, Entlohnungssystem, Motivation, Kommunikation, Organisation.</p><p><b>Risiken entlang der Wertschöpfungskette</b> (Leistungsrisiken): in primären Prozessen (Einkauf, Logistik, Verkauf) und Unterstützungsprozessen.</p><p><b>Finanzrisiken</b>: Liquiditätsrisiken (verzögerte Zuflüsse, unerwartete Abflüsse), Ausfallrisiken (Schuldner zahlt nicht).</p><p><b>Extern:</b> Markt- und Wettbewerbsrisiken (Konjunktur, neue Wettbewerber, Abhängigkeit von wenigen Kunden, Preiskampf, Technologie – vgl. Five Forces nach Porter), Finanzmarktrisiken (Währung, Zinsen), politische und rechtliche Risiken (Sanktionen, neue Gesetze), gesellschaftliche Risiken (Demografie, Konsumverhalten, Reputationsrisiken durch soziale Netzwerke und Bewertungsportale), sonstige (Katastrophen).</p>",
merk:"Intern: Strategie, Governance, Wertschöpfung, Finanzen. Extern: Markt, Finanzmarkt, Politik/Recht, Gesellschaft, Sonstiges."},
{t:"Risikobewertung: Risikoinventar und Risikomatrix",g:G.rmMatrix,what:"Risiken werden qualitativ gewichtet und möglichst quantifiziert. Das <b>Risikoinventar</b> listet alle Risiken mit Bewertung (z. B. Skala 1–5). Die <b>Risikomatrix</b> (Risk Map) zeigt sie nach <b>Eintrittswahrscheinlichkeit</b> und <b>Schadenshöhe</b>.",
deep:"<p><b>Probleme der Bewertung:</b> unvollständige Informationen über die Zukunft, Bewertung ist immer subjektiv.</p><p><b>Risikoinventar (Skript):</b> je Risikofeld eine Beschreibung für „gering“ (1) und „hoch“ (5), z. B. strategische Risiken: klare Strategie, gutes Sortiment (1) ↔ schwammige Strategie, unausgewogenes Sortiment (5).</p><p><b>Risikomatrix lesen:</b> Feld IV (hohe Wahrscheinlichkeit, sehr großer Schaden) = sofort handeln, Topmanagement. Feld I (selten, geringer Schaden) = beobachten oder selbst tragen. Feld III (häufig, aber klein) = vermindern. Feld II (selten, aber teuer) = überwälzen, z. B. versichern.</p>",
merk:"Wahrscheinlichkeit × Schadenshöhe = Bedeutung des Risikos."},
{t:"Risikobewältigung: die fünf Strategien",g:G.rmStrat,what:"Für jedes bewertete Risiko wird eine <b>Risikostrategie</b> gewählt: vermeiden, vermindern, überwälzen, diversifizieren oder übernehmen.",
deep:"<p><b>Vermeidung</b>: Aktivität aufgeben (z. B. Markteintritt in ein Krisenland absagen) – nur bei existenzbedrohenden Risiken sinnvoll, weil damit auch Chancen wegfallen.</p><p><b>Verminderung</b>: Fachpersonal, Schulungen, Sicherheitstechnik, Alarmanlage, Brandschutz.</p><p><b>Überwälzung</b>: Versicherungen, Vertragsgestaltung (Haftungsklauseln), Outsourcing, Factoring (Forderungsausfall), Leasing.</p><p><b>Diversifikation</b>: Sortiment erweitern, mehrere Lieferanten, mehrere Märkte – „nicht alle Eier in einen Korb“.</p><p><b>Übernahme</b>: Risiko bewusst selbst tragen – mit Eigenkapital, Rückstellungen oder kalkulatorischen Wagniszuschlägen (Verbindung zur KLR!).</p>",
merk:"VVÜDÜ: Vermeiden, Vermindern, Überwälzen, Diversifizieren, Übernehmen.",
kl:"In Fallaufgaben: Risiko benennen → einordnen (Feld, Bewertung) → passende Strategie mit Beispiel begründen."},
{t:"Integriertes Managementsystem",what:"Neuere Managementsysteme betrachten alle Faktoren, die die Unternehmensentwicklung beeinflussen. Im <b>integrierten Managementsystem (IMS)</b> werden Risiko-, Qualitäts- und Umweltmanagement zusammengeführt.",
deep:"<p>Qualitäts- und Umweltmanagement sind laut Klausurhinweis <b>nicht</b> prüfungsrelevant. Wichtig ist nur: Das Risikomanagement ist Teil eines integrierten Managementsystems, das über die Führung einzelner Funktionsbereiche hinausgeht.</p>"}
],

/* ===== Rechenaufgaben ===== */
function r2(x){return Math.round((x+(x>=0?1:-1)*1e-9)*100)/100;}
function r3(x){return Math.round((x+(x>=0?1:-1)*1e-9)*1000)/1000;}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function rs(a,b,st){var n=Math.round((b-a)/st);return r2(a+ri(0,n)*st);}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function E(v){return eur(v);}
function P(v,d){return fmtN(v,d==null?2:d)+" %";}
function N(v,d){return fmtN(v,d);}
function F(l,a,u,tol,o){o=o||{};return {l:l,a:a,u:u||"",tol:tol==null?0.011:tol,type:o.type||"num",hint:o.hint};}
var CALCS={
zinsen:{m:"m1",t:"Kalkulatorische Zinsen",gen:function(ex){var AV=ex?7200000:rs(2e6,9e6,1e5),UV=ex?5200000:rs(1e6,6e6,1e5),AB=ex?900000:rs(2e5,1.2e6,5e4),z=ex?9:pick([6,7,8,9,10]),V=AV+UV,K2=V-AB,Z=r2(K2*z/100);
return {txt:"Ein Handelsunternehmen weist folgende Werte aus: betriebsnotwendiges Anlagevermögen (kalk. Restwerte) <b>"+E(AV)+"</b>, betriebsnotwendiges Umlaufvermögen (kalk. Mittelwerte) <b>"+E(UV)+"</b>, Abzugskapital (Kundenanzahlungen, Lieferantenkredite ohne Skonto) <b>"+E(AB)+"</b>. Der kalkulatorische Zinssatz beträgt <b>"+P(z,0)+"</b>.",
f:[F("Betriebsnotwendiges Vermögen",V,"€"),F("Betriebsnotwendiges Kapital",K2,"€"),F("Kalkulatorische Zinsen pro Jahr",Z,"€",0.6)],
s:["Betriebsnotwendiges Vermögen = AV + UV = "+E(AV)+" + "+E(UV)+" = <b>"+E(V)+"</b>","Betriebsnotwendiges Kapital = Vermögen − Abzugskapital = "+E(V)+" − "+E(AB)+" = <b>"+E(K2)+"</b>","Kalk. Zinsen = "+E(K2)+" × "+z+" % = <b>"+E(Z)+"</b>"]};}},
wagnis:{m:"m1",t:"Kalkulatorische Wagnisse",gen:function(ex){var B=ex?35000000:rs(1e7,5e7,1e6),rate=ex?2.5:pick([1.5,2,2.4,2.5,3,3.2,4]),V=r2(B*rate/100),C=ex?3000000:rs(1e6,5e6,1e5),S=r2(V/B*100),Kc=r2(C*S/100);
return {txt:"Die Verluste an Vorräten durch Schwund, Verderb und Diebstahl betrugen in den letzten 5 Jahren durchschnittlich <b>"+E(V)+"</b>. Die durchschnittlichen Bezugspreise im gleichen Zeitraum lagen bei <b>"+E(B)+"</b>. Im laufenden Monat betragen die Bezugspreise <b>"+E(C)+"</b>.",
f:[F("Wagnissatz",S,"%",0.011),F("Wagniskosten des Monats",Kc,"€",0.6)],
s:["Es handelt sich um ein <b>Beständewagnis</b> (Einzelwagnis → Kostenbestandteil).","Wagnissatz = Ø Verluste ÷ Ø Bezugsgröße × 100 = "+E(V)+" ÷ "+E(B)+" × 100 = <b>"+P(S)+"</b>","Wagniskosten = "+P(S)+" × "+E(C)+" = <b>"+E(Kc)+"</b>"]};}},
abgrenzung:{m:"m1",t:"Unternehmens-, neutrales und Betriebsergebnis",gen:function(ex){var Ee=ex?70000:rs(4e5,9e5,1e4),A=ex?40000:r2(Ee-rs(2e4,1.2e5,1e3)),nE=ex?40000:rs(5e3,6e4,1e3),nA=ex?15000:rs(5e3,6e4,1e3),L=ex?0:pick([0,0,rs(4e4,9e4,5e3)]),UE=r2(Ee-A),Le=r2(Ee-nE),Ko=r2(A-nA+L),BE=r2(Le-Ko),NE=r2(UE-BE);
var t="Aus der GuV eines Einzelunternehmens: Erträge gesamt <b>"+E(Ee)+"</b>, davon neutrale Erträge <b>"+E(nE)+"</b>. Aufwendungen gesamt <b>"+E(A)+"</b>, davon neutrale Aufwendungen <b>"+E(nA)+"</b>."+(L?" Zusätzlich soll ein <b>kalkulatorischer Unternehmerlohn von "+E(L)+"</b> verrechnet werden.":" Kalkulatorische Kosten sind nicht zu berücksichtigen.");
var st=["Unternehmensergebnis = Erträge − Aufwendungen = "+E(Ee)+" − "+E(A)+" = <b>"+E(UE)+"</b>","Leistungen = Erträge − neutrale Erträge = "+E(Le),"Kosten = Aufwendungen − neutrale Aufwendungen"+(L?" + kalk. Unternehmerlohn (Zusatzkosten)":"")+" = "+E(Ko),"Betriebsergebnis = Leistungen − Kosten = <b>"+E(BE)+"</b>","Neutrales Ergebnis = Unternehmensergebnis − Betriebsergebnis = <b>"+E(NE)+"</b>"+(L?" (neutrale Erträge − neutrale Aufwendungen + "+E(L)+" Ergebnis der kostenrechnerischen Korrektur)":"")];
return {txt:t,f:[F("Unternehmensergebnis",UE,"€"),F("Betriebsergebnis",BE,"€"),F("Neutrales Ergebnis",NE,"€")],s:st};}},
kosten:{m:"m2",t:"Gesamt- und Stückkosten",gen:function(ex){var Kf=ex?1200:rs(1000,20000,100),kv=ex?4.5:rs(1,40,0.5),x=ex?600:rs(100,2000,50),Kv=r2(kv*x),Kg=r2(Kf+Kv),kf=r2(Kf/x),k=r2(Kg/x);
return {txt:"Ein Großhändler hat für eine Warengruppe fixe Kosten von <b>"+E(Kf)+"</b> im Monat. Die variablen Stückkosten (Einstandspreis) betragen <b>"+E(kv)+"</b>. Im Monat werden <b>"+N(x)+" Stück</b> verkauft.",
f:[F("Variable Gesamtkosten Kv",Kv,"€"),F("Gesamtkosten K",Kg,"€"),F("Fixe Stückkosten kf",kf,"€",0.011),F("Stückkosten k",k,"€",0.011)],
s:["Kv = kv × x = "+E(kv)+" × "+N(x)+" = <b>"+E(Kv)+"</b>","K = Kf + Kv = "+E(Kf)+" + "+E(Kv)+" = <b>"+E(Kg)+"</b>","kf = Kf ÷ x = "+E(Kf)+" ÷ "+N(x)+" = <b>"+E(kf)+"</b>","k = K ÷ x = "+E(Kg)+" ÷ "+N(x)+" = <b>"+E(k)+"</b> (= kf + kv)"]};}},
bep:{m:"m2",t:"Break-even-Point",gen:function(ex){var db=ex?1.5:rs(2,20,0.5),x=ex?800:rs(200,5000,50),Kf=r2(db*x),kv=ex?4.5:rs(5,60,0.5),p=r2(kv+db),U=r2(x*p);
return {txt:"Ein Artikel wird für <b>"+E(p)+"</b> netto verkauft. Die variablen Stückkosten betragen <b>"+E(kv)+"</b>, die Fixkosten der Periode <b>"+E(Kf)+"</b>.",
f:[F("Stückdeckungsbeitrag db",db,"€"),F("Break-even-Menge",x,"Stück",0.5),F("Umsatz am Break-even-Point",U,"€",1)],
s:["db = p − kv = "+E(p)+" − "+E(kv)+" = <b>"+E(db)+"</b>","x(BEP) = Kf ÷ db = "+E(Kf)+" ÷ "+E(db)+" = <b>"+N(x)+" Stück</b>","Umsatz = x × p = "+N(x)+" × "+E(p)+" = <b>"+E(U)+"</b>","Probe: Kosten = "+E(Kf)+" + "+N(x)+" × "+E(kv)+" = "+E(r2(Kf+x*kv))+" = Umsatz ✓"]};}},
hkz:{m:"m4",t:"Handlungskostenzuschlag",gen:function(ex){var HK=ex?26390:rs(1e4,2e5,10),WE=ex?85000:rs(5e4,8e5,1000),h=r2(HK*100/WE),EP=ex?40:rs(5,150,0.5),SK=r2(EP*(1+h/100));
return {txt:"Laut BAB entfallen auf eine Kostenstelle Handlungskosten von <b>"+E(HK)+"</b>. Der Wareneinsatz dieser Kostenstelle beträgt <b>"+E(WE)+"</b>. Ein Artikel dieser Warengruppe hat einen Einstandspreis von <b>"+E(EP)+"</b>.",
f:[F("Handlungskostenzuschlagssatz",h,"%",0.011),F("Selbstkosten des Artikels",SK,"€",0.02)],
s:["HKZ = Handlungskosten × 100 ÷ Wareneinsatz = "+E(HK)+" × 100 ÷ "+E(WE)+" = <b>"+P(h)+"</b>","Handlungskosten des Artikels = "+E(EP)+" × "+P(h)+" = "+E(r2(EP*h/100)),"Selbstkosten = Einstandspreis + Handlungskosten = <b>"+E(SK)+"</b>"]};}},
bab:{m:"m4",t:"Gemeinkosten im BAB verteilen",gen:function(ex){var k=ex?[3,3,2]:[ri(1,5),ri(1,5),ri(1,5)],sum=k[0]+k[1]+k[2],part=ex?4275:rs(500,8000,5),tot=r2(part*sum),nm=ex?"Personalkosten":pick(["Personalkosten","Miete","Werbung und Dekoration","Energiekosten","Versicherungen"]),v=k.map(function(x){return r2(x*part);});
return {txt:"Die Kostenart <b>"+nm+"</b> beträgt <b>"+E(tot)+"</b> und soll im Verhältnis <b>"+k.join(" : ")+"</b> auf die Kostenstellen Glas/Porzellan, Haushaltswaren und Geschenkartikel verteilt werden.",
f:[F("Glas/Porzellan",v[0],"€"),F("Haushaltswaren",v[1],"€"),F("Geschenkartikel",v[2],"€")],

if((b=t.closest(".gbtn"))||(b=t.closest(".g-again"))){var m=modBy(b.getAttribute("data-m")),kd=b.getAttribute("data-kind");if(kd==="mem")startMatch(m);else if(kd==="run")startRun(m);else if(kd==="sort"){openModal("");startSort(m,+b.getAttribute("data-i"));}else startSeq(m);return;}
if((b=t.closest(".mcol button"))){matchClick(b);return;}
if(t.closest(".run-restart")){if(RUN||lastRunM)startRun(RUN?RUN.m:lastRunM);return;}
if(t.closest(".run-hint")){if(RUN&&RUN.next<RUN.R.items.length)runMsg("Nächster Begriff: <b>"+esc(RUN.R.items[RUN.next])+"</b>",2000);return;}
if((b=t.closest(".sortc"))){sortClick(b);return;}
if((b=t.closest(".pool button"))){seqClick(b);return;}
if((b=t.closest(".fdeck"))){fc.deck=b.getAttribute("data-d");fc.last=null;fc.cur=pickCard();modal.querySelector(".mc").innerHTML=fcHtml();return;}
if(t.closest(".fc")||t.closest(".f-flip")){var f=modal.querySelector(".fc");if(f)f.classList.toggle("flip");return;}
if(t.closest(".f-ok")){rate(true);return;}if(t.closest(".f-no")){rate(false);return;}
if(t.closest(".f-reset")){deck().forEach(function(c){delete S.f[c.id];});save();fc.cur=pickCard();modal.querySelector(".mc").innerHTML=fcHtml();refresh();return;}
if((b=t.closest(".resetall"))){if(b.getAttribute("data-sure")){var gm=S.gm;S=fresh();S.gm=gm;save();root.querySelectorAll(".done-l input").forEach(function(x){x.checked=false;});root.querySelectorAll(".card.done").forEach(function(x){x.classList.remove("done");});refresh();}else{b.setAttribute("data-sure","1");b.textContent="Wirklich alles löschen? Nochmal klicken";}return;}
if((b=t.closest(".opts button"))){if(b.disabled)return;var q=b.closest(".q"),cc=+q.getAttribute("data-c"),j=+b.getAttribute("data-j");q.querySelectorAll(".opts button").forEach(function(x){x.disabled=true;if(+x.getAttribute("data-j")===cc)x.classList.add("ok");});if(j!==cc)b.classList.add("no");q.setAttribute("data-a",j===cc?"1":"0");q.querySelector(".expl").classList.add("on");streak(j===cc);if(j===cc)addXP(5,"Quiz");score(q.closest(".quiz"));return;}
if((b=t.closest(".q-reset"))){var qz=b.closest(".quiz");qz.querySelectorAll(".q").forEach(function(q){q.removeAttribute("data-a");q.querySelector(".expl").classList.remove("on");q.querySelectorAll(".opts button").forEach(function(x){x.disabled=false;x.classList.remove("ok","no");});});score(qz);return;}
if(t.id==="ufNewFinal"){buildFinal();return;}
if(t.closest(".go-lz")){show("lz");var tp=root.getBoundingClientRect().top+window.pageYOffset-8;if(window.pageYOffset>tp)window.scrollTo(0,tp);return;}
if((b=t.closest(".mm-set"))){setMeme(+b.getAttribute("data-v"));return;}
if(t.closest(".mpop")){t.closest(".mpop").hidden=true;return;}
});
function score(qz){var qs=qz.querySelectorAll(".q"),ok=0,open=0;qs.forEach(function(q){var a=q.getAttribute("data-a");if(a==="1")ok++;if(a===null)open++;});var s=ok+" von "+qs.length+" richtig · "+open+" offen";
if(!open){var p=ok/qs.length,id=qz.getAttribute("data-quiz");if(p>(S.q[id]||0)){S.q[id]=p;save();}s+=p>=0.9?" – hervorragend!":p>=0.7?" – gut, schau dir die Fehler noch einmal an.":" – lies die Themenkarten noch einmal.";checkBadges();refresh();}qz.querySelector(".score").textContent=s;}
document.addEventListener("click",function(ev){if(!ev.target.closest||!ev.target.closest(".ab"))hideTip();});
window.addEventListener("scroll",hideTip,{passive:true});
root.addEventListener("mouseover",function(ev){var a=ev.target.closest&&ev.target.closest(".ab");if(a)showTip(a);});
root.addEventListener("mouseout",function(ev){if(ev.target.closest&&ev.target.closest(".ab"))hideTip();});
root.addEventListener("focusin",function(ev){var a=ev.target.closest&&ev.target.closest(".ab");if(a)showTip(a);});
root.addEventListener("focusout",function(ev){if(ev.target.closest&&ev.target.closest(".ab"))hideTip();});
root.addEventListener("keydown",function(ev){if(ev.key==="Enter"&&ev.target.closest&&ev.target.closest(".fld input")){ev.preventDefault();calcCheck(ev.target.closest(".calc"));}});
document.addEventListener("keydown",function(ev){if(modal.hidden)return;if(ev.key==="Escape"){closeModal();return;}if(fc.cur&&modal.querySelector(".fc")){if(ev.key===" "&&!(document.activeElement&&document.activeElement.tagName==="BUTTON"&&!document.activeElement.closest(".fc"))){ev.preventDefault();modal.querySelector(".fc").classList.toggle("flip");}else if(ev.key==="ArrowRight")rate(true);else if(ev.key==="ArrowLeft")rate(false);}});
root.addEventListener("change",function(ev){var t=ev.target;if(t.id==="ufGame"){S.gm=t.checked;save();root.classList.toggle("nogame",!S.gm);return;}if(t.id==="ufMemeSel"){setMeme(+t.value);return;}if(t.classList&&t.classList.contains("lzcb")){var bl=t.closest(".lzb"),li=+bl.getAttribute("data-lz");if(!S.lz)S.lz={};var was2=!!S.lz[li];S.lz[li]=t.checked;bl.classList.toggle("done",t.checked);save();var dn=0;LZ.forEach(function(x,i){if(S.lz[i])dn++;});root.querySelector("#lzBar").style.width=Math.round(dn/LZ.length*100)+"%";root.querySelector("#lzPct").textContent=dn+"/"+LZ.length;if(t.checked&&!was2){addXP(10,"Block erledigt");if(dn===LZ.length)toast("Mut zur Lücke komplett – du bist bereit!",true);}return;}
var c=t.closest&&t.closest(".done-l");if(!c)return;var card=t.closest(".card"),id=card.getAttribute("data-t"),was=!!S.t[id];S.t[id]=t.checked;card.classList.toggle("done",t.checked);save();if(t.checked&&!was)addXP(5,"Thema gelernt");else refresh();checkBadges();});
root.addEventListener("input",function(ev){if(ev.target.id!=="ufSearch")return;var v=ev.target.value.toLowerCase();root.querySelectorAll(".gl dt").forEach(function(dt){var dd=dt.nextElementSibling,hit=!v||(dt.textContent+" "+dd.textContent).toLowerCase().indexOf(v)>=0;dt.hidden=dd.hidden=!hit;});});
})();
</script>
