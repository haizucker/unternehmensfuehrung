var MODS_BL=[];
MODS_BL.push({id:"t1",tab:"1 Transport & Beteiligte",title:"Transport: Begriff und Beteiligte",intro:"Transport heißt, Güter von A nach B zu bringen. Wer ist dabei wofür verantwortlich? Hier lernst du die Rollen im Fracht- und Speditionsgeschäft, den Sammelladungsverkehr und wo Transport in der Logistikkette vorkommt.",
topics:[
{t:"Was ist Transport?",what:"<b>Transport</b> ist die <b>Raumüberbrückung</b> oder <b>Ortsveränderung</b> von Transportgütern mit Hilfe von Transportmitteln. Unterschieden wird der <b>außerbetriebliche</b> Transport (vom Lieferanten zum Unternehmen und vom Unternehmen zum Kunden) und der <b>innerbetriebliche</b> Transport, das „Fördern“ (z. B. vom Wareneingang ins Lager).",deep:"<p>Durch den Strukturwandel vieler Branchen steigen die Anforderungen an den Transport: stärkere weltweite Arbeitsteilung, Verlagerung arbeitsintensiver Produktion ins Ausland, geringere Fertigungstiefe und kleine Losgrößen (bestandsarme Fabrik). Folge: <b>geringere Bestellmengen, häufigere Bestellungen</b> und immer hochwertigere, komplexere Produkte – das beeinflusst die Wahl des Verkehrsträgers.</p>",merk:"Außerbetrieblich = transportieren · innerbetrieblich = fördern.",kl:"Definition auswendig: „Raumüberbrückung bzw. Ortsveränderung von Transportgütern mit Hilfe von Transportmitteln“."},
{t:"Die Beteiligten",g:GB.beteiligte,what:"Der <b>Frachtführer</b> befördert die Ware physisch (Lkw-Unternehmen, Bahn, Reederei, Fluggesellschaft). Der <b>Spediteur</b> organisiert den Versand für seinen Auftraggeber und darf auch selbst fahren (<b>Selbsteintritt</b>). Der <b>Frachtvermittler</b> bringt nur Frachtführer und Ladung zusammen und erhält eine Provision.",deep:"<p><b>Absender</b> = Auftraggeber des Transports, schließt mit dem Frachtführer den <b>Frachtvertrag</b>. <b>Versender</b> = Auftraggeber des Spediteurs, schließt den <b>Speditionsvertrag</b>. Der Spediteur tritt gegenüber dem Frachtführer selbst als Absender auf.</p><p>Der Frachtvermittler ist <b>nicht</b> Beteiligter des Frachtgeschäfts und trägt deshalb keine Verantwortung für die Durchführung des Transports.</p><p>Seit Ende der 1980er Jahre werden viele Spediteure zu <b>Logistikdienstleistern</b>: externe Lagerhaltung inkl. Lagerarbeiten (z. B. Qualitätskontrolle), Verpacken und Kommissionieren, Versanddokumente und Verzollung.</p>",merk:"Frachtführer fährt · Spediteur organisiert · Frachtvermittler vermittelt.",kl:"Beliebt: „Grenzen Sie Spediteur und Frachtführer ab.“ – organisieren vs. befördern, Speditions- vs. Frachtvertrag, Selbsteintritt."},
{t:"Sammelladung und Transportarten",g:GB.sammel,what:"Im <b>Sammelladungsverkehr</b> bündelt der Spediteur Sendungen vieler Versender: <b>Vorlauf</b> (Sammeln im Nahverkehr, bis ca. 80 km) → <b>Hauptlauf</b> (gebündelter Fernverkehr) → <b>Nachlauf</b> (Verteilen im Nahverkehr). Daneben unterscheidet man <b>Sammeltransport</b> (eine Tour, mehrere Kunden) und <b>Einzeltransport</b> (eine Fahrt je Kunde).",deep:"<p>Vorteil der Sammelladung: Kleine Sendungen werden zu einer gut ausgelasteten Ladung – günstiger je Sendung, weniger Leerfahrten, weniger Verkehr. Nachteil: längere Laufzeit durch Umschlag.</p>",merk:"Sammeln – Hauptlauf – Verteilen."},
{t:"Logistikphasen und Lagerstufen",g:GB.phasen,what:"Die Unternehmenslogistik gliedert sich nach dem Güterfluss in <b>Beschaffungs-</b>, <b>Intra-</b> (Produktions-), <b>Distributions-</b> und <b>Entsorgungslogistik</b>. Zwischen den Transporten liegen <b>Lagerstufen</b>: Werkslager → Zentrallager → Regionallager → Auslieferungslager.",deep:GB.stufen+"<p><b>Werkslager</b>: bei der Produktionsstätte, nur dort produzierte Erzeugnisse, kurzfristiger Mengenausgleich. <b>Zentrallager</b>: wenige, ganzes Sortiment, hoher Umschlag, verkehrsgünstig. <b>Regionallager</b>: in Absatzschwerpunkten, Teilsortiment, Puffer für flexible Disposition. <b>Auslieferungslager</b>: ganz nah am Kunden, absatzstärkste Produkte, geringe Transportkosten.</p>",merk:"Je näher am Kunden, desto kleiner das Sortiment."}],
quiz:[{q:"Wer übernimmt die physische Beförderung der Ware?",o:["Frachtführer","Spediteur","Frachtvermittler","Versender"],c:0,e:"Der Frachtführer führt den Transport selbst durch."},{q:"Wie heißt es, wenn der Spediteur mit eigenen Fahrzeugen selbst befördert?",o:["Selbsteintritt","Sammelladung","Werkverkehr","Insourcing"],c:0,e:"Das Recht zum Selbsteintritt hat der Spediteur."},{q:"Mit wem schließt der Versender den Speditionsvertrag?",o:["mit dem Spediteur","mit dem Frachtführer","mit dem Empfänger","mit dem Frachtvermittler"],c:0,e:"Versender ↔ Spediteur = Speditionsvertrag; Absender ↔ Frachtführer = Frachtvertrag."},{q:"Warum haftet der Frachtvermittler nicht für den Transport?",o:["Er ist nicht Beteiligter des Frachtgeschäfts","Er ist immer versichert","Er fährt nur im Nahverkehr","Er ist der Empfänger"],c:0,e:"Er vermittelt nur gegen Provision."},{q:"Was passiert im Vorlauf der Sammelladung?",o:["Sendungen werden im Nahverkehr gesammelt","Ware wird an Empfänger verteilt","Der Fernverkehr findet statt","Die Ware wird verzollt"],c:0,e:"Vorlauf = Sammeln, Hauptlauf = Fernverkehr, Nachlauf = Verteilen."},{q:"Welche Lagerstufe enthält das gesamte Sortiment und füllt nachgelagerte Lager auf?",o:["Zentrallager","Auslieferungslager","Regionallager","Werkslager"],c:0,e:"Zentrallager: wenige, gesamte Sortimentsbreite, hoher Umschlag."},{q:"Innerbetrieblicher Transport heißt auch …",o:["Fördern","Spedieren","Disponieren","Kommissionieren"],c:0,e:"Innerbetrieblich = Fördern mit Fördermitteln."}],

MODS_BL.push({id:"t2",tab:"2 Fördern & Transportmittel",title:"Innerbetrieblicher Transport und Transportmittel",intro:"Im Betrieb wird „gefördert“ – mit Förderbändern, Staplern oder Kränen. Welches Fördermittel passt, hängt vom Gut, der Menge und der Strecke ab.",
topics:[
{t:"Fördermittel auswählen",g:GB.bestimm,what:"<b>Fördermittel</b> sind alle Transportmittel für den innerbetrieblichen Materialfluss. Ausgewählt werden sie nach vier <b>Bestimmungsgrößen</b>: Fördergut, Förderintensität, Förderstrecke und Gesetze. Ziele: optimale Nutzung, hoher Service, Flexibilität und Transparenz.",merk:"Gut – Intensität – Strecke – Gesetze."},
{t:"Stetig- und Unstetigförderer",g:GB.foerder,what:"<b>Stetigförderer</b> bewegen Güter auf festem, gleichbleibendem Weg stetig (horizontal, vertikal, geneigt), z. B. Förderband, Rollenbahn. <b>Unstetigförderer</b> arbeiten mit Unterbrechungen und bedarfsorientiert, ihr Weg ist teilweise frei wählbar, z. B. Gabelstapler, Kran. <b>Flurgebunden</b> = am oder im Boden, <b>flurfrei</b> = an der Hallendecke.",deep:table(["Stetigförderer: Vorteile","Stetigförderer: Nachteile"],[["permanente Transportbereitschaft","geringe Flexibilität (ortsfest)"],["niedriger Personalbedarf","hoher Investitionsbedarf"],["hohe Automatisierbarkeit","lohnt nur bei kontinuierlichem Materialfluss"],["gute Raumhöhennutzung (Deckenförderer)","Stillstand des Materialflusses bei Ausfall"],["keine Leerfahrten",""]]),merk:"Stetig = fest und dauernd · unstetig = flexibel mit Pausen.",kl:"Vor- und Nachteile des Stetigförderers sind ein Klassiker – die Nachteile sind spiegelbildlich die Vorteile des Staplers."},
{t:"Förderhilfsmittel",what:"<b>Förderhilfsmittel</b> sind Packmittel, die das Gut schützen und lade-, transport- und lagerfähig machen: <b>formstabile</b> (Paletten, Behälter wie Kisten, Boxen, Fässer, Kanister) und <b>forminstabile</b> Packmittel (Netze, Säcke, Beutel).",merk:"Palette = formstabil, Sack = forminstabil."},
{t:"Transportmittel und -wege",g:GB.mittel,what:"Im außerbetrieblichen Transport gibt es <b>portable</b> (Transportgefäße), <b>mobile</b> (Fahrzeuge) und <b>stationäre</b> Transportmittel (Leitungen, Förderbänder, Lift). <b>Transportwege</b> verlaufen zu Lande (Straße, Schiene), zu Wasser und in der Luft.",merk:"Gefäß – Fahrzeug – Anlage."}],
quiz:[{q:"Welches Fördermittel ist ein Stetigförderer?",o:["Rollenbahn","Gabelstapler","Hubwagen","Brückenkran"],c:0,e:"Rollenbahn und Förderband fördern stetig auf festem Weg."},{q:"Was ist ein Nachteil von Stetigförderern?",o:["geringe Flexibilität","hoher Personalbedarf","viele Leerfahrten","keine Automatisierung möglich"],c:0,e:"Ortsfest installiert → unflexibel und teuer."},{q:"„Flurfrei“ bedeutet …",o:["an der Hallendecke befestigt","im Boden eingelassen","nur im Freien","ohne Fahrer"],c:0,e:"Flurgebunden = Boden, flurfrei = Decke."},{q:"Welche Größe gehört NICHT zu den Bestimmungsgrößen der Fördermittelauswahl?",o:["Werbewirkung","Fördergut","Förderstrecke","Förderintensität"],c:0,e:"Bestimmungsgrößen: Fördergut, Förderintensität, Förderstrecke, Gesetze."},{q:"Ein Sack ist ein …",o:["forminstabiles Packmittel","formstabiler Behälter","Stetigförderer","stationäres Transportmittel"],c:0,e:"Netze, Säcke, Beutel sind forminstabil."},{q:"Ein Förderband im Lager ist ein …",o:["stationäres Transportmittel","portables Transportmittel","Unstetigförderer","Förderhilfsmittel"],c:0,e:"Stationär: Leitungen, Förderbänder, Lift."}],

calcs:[],cards:[["Bestimmungsgrößen der Fördermittelauswahl?","Fördergut, Förderintensität, Förderstrecke, Gesetze."],["Ziele des innerbetrieblichen Transports?","optimale Nutzung, hoher Service, Flexibilität, Transparenz."],["Stetigförderer – 3 Vorteile?","permanente Bereitschaft, wenig Personal, automatisierbar, keine Leerfahrten."],["Stetigförderer – 3 Nachteile?","unflexibel, hohe Investition, lohnt nur bei Auslastung, Stillstand bei Ausfall."],["Förderhilfsmittel?","Packmittel: formstabil (Palette, Behälter) und forminstabil (Netz, Sack, Beutel)."]]});
MODS_BL.push({id:"t3",tab:"3 Verkehrsträger",title:"Verkehrsträger auswählen",intro:"Straße, Schiene, Wasser, Luft oder Rohr? Jeder Verkehrsträger hat Stärken und Schwächen. In der Klausur musst du begründet auswählen können.",
topics:[
{t:"Sechs Verkehrsträger und Auswahlkriterien",g:GB.wertig,what:"<b>Verkehrsträger</b> = Gesamtheit aller Verkehrsmittel, die die gleiche Infrastruktur nutzen: <b>Straßenverkehr, Eisenbahn, Binnenschifffahrt, Seeschifffahrt, Luftverkehr, Rohrfernleitungen</b>. Beurteilt werden sie nach den <b>Transportkosten</b> und der <b>Verkehrswertigkeit</b>.",deep:GB.traeger,merk:"Kosten + 8 × Wertigkeit: Masse, Tempo, Netz, Berechenbarkeit, Zeit- und Raumflexibilität, Sicherheit, Umwelt.",kl:"Auswahlaufgaben immer mit mehreren Kriterien begründen (z. B. „hohe Masse, nicht eilig, kostensensibel → Binnenschiff“)."},
{t:"Straßengüterverkehr",what:"Der Lkw ist der flexibelste Verkehrsträger: <b>Haus-zu-Haus</b> ohne Umladen, engmaschiges Netz, kurze Lieferfristen, JIT möglich. Unterschieden werden <b>Werkverkehr</b> (für eigene Zwecke, erlaubnisfrei) und <b>gewerblicher Güterverkehr</b> (gegen Entgelt, erlaubnispflichtig).",deep:table(["Vorteile","Nachteile"],[["Haus-zu-Haus ohne Umladen","begrenztes Volumen und Gewicht"],["kurze Lieferfristen, schnell","abhängig von Wetter, Stau, Straßen"],["Lkw erreicht fast jeden Ort","Sonn- und Feiertagsfahrverbot"],["flexible Termine","hoher Energieaufwand, Lärm, Abgase"],["passende Spezialfahrzeuge","Unfallgefahr, Lenk- und Ruhezeiten"],["JIT → weniger Lager","Einschränkungen bei Gefahrgut"]])+"<p>Meilensteine: 1994 Tariffreiheit, 1998 Lizenzen statt Konzessionen und Wegfall des Kabotageverbots, 2004 EU-Osterweiterung.</p>",merk:"Flexibel und schnell, aber Stau, Fahrverbot und Umwelt."},
{t:"Eisenbahn",what:"Die Bahn ist stark bei <b>kostengünstigen Massentransporten auf Langstrecken</b>, unabhängig von Stau und Sonntagsfahrverbot und relativ umweltfreundlich. Schwächen: unflexibel, an Fahrplan und Schienennetz gebunden, häufiges Umladen, schwach auf kurzen Strecken.",deep:"<p>Weitere Punkte: Spezialwagen, hohe Transportsicherheit, geringe Gefahrgut-Einschränkungen; aber Monopolstellung des Hauptbetreibers, unterschiedliche Spurweiten im Ausland, Lärm. Die politisch gewünschte Verlagerung von der Straße auf die Schiene gelingt aus Flexibilitäts- und Kostengründen bisher kaum.</p>",merk:"Viel, weit, günstig – aber starr."},
{t:"Binnen- und Seeschiff",what:"<b>Binnenschiff</b>: nicht eilige, kostenempfindliche <b>Massengüter</b>, sehr hohe Massenleistung, umweltfreundlich, 24 h Fahrt per Radar – aber langsam, eingeschränktes Netz, abhängig von Wasserstand und Eis. <b>Seeschiff</b>: wichtig für Im- und Export, große Volumen über weite Strecken, günstig je tkm – aber langsam und wetterabhängig.",deep:"<p>Ohne eigene Anlegestelle entstehen beim Binnenschiff höhere Kosten durch <b>gebrochenen Verkehr</b> (Umladen). Bei der Seeschifffahrt unterscheidet man <b>Linienschifffahrt</b> (feste Routen und Fahrpläne) und <b>Trampschifffahrt</b> (Charter nach Bedarf).</p>",merk:"Schiff = Masse und Geduld."},
{t:"Luftfracht, Rohrleitung, Drohne",what:"<b>Luftfracht</b> eignet sich für kleine, <b>zeitkritische oder hochwertige</b> Sendungen: sehr schnell und zuverlässig, aber teuer, wenig Kapazität und umweltbelastend. Nur etwa <b>10 %</b> der Transportzeit ist Flugzeit, <b>90 %</b> entfallen auf Vor- und Nachlauf, Umschlag und Zoll. <b>Rohrleitungen</b> transportieren Flüssiges und Gase (Wasser, Erdöl, Erdgas) zuverlässig und umweltfreundlich, brauchen aber hohe Investitionen.",deep:"<p>Rohrleitung: wetterfest, unabhängig von Verkehrswegen, langfristig günstig – aber unflexibel, aufwendige Genehmigungen, Leck-Gefahr, nur rentabel bei langfristig gesichertem Absatz. <b>Transportdrohnen</b> sind eine Zukunftsoption für eilige Kleinsendungen.</p>",merk:"Flugzeug: schnell und teuer · Rohr: stetig und starr."}],
quiz:[{q:"Welcher Verkehrsträger bietet Haus-zu-Haus-Verkehr ohne Umladen?",o:["Straße (Lkw)","Eisenbahn","Binnenschiff","Luftfracht"],c:0,e:"Der Lkw erreicht nahezu jeden Ort direkt."},{q:"Werkverkehr ist …",o:["Güterkraftverkehr für eigene Zwecke, erlaubnisfrei","Güterverkehr gegen Entgelt, erlaubnispflichtig","Schienenverkehr der Bahn","Verkehr zwischen zwei Werken im Ausland"],c:0,e:"Gewerblicher Güterverkehr = gegen Entgelt, erlaubnispflichtig."},{q:"Wie viel Prozent der Transportzeit entfallen bei Luftfracht ungefähr auf die Flugzeit?",o:["10 %","50 %","75 %","90 %"],c:0,e:"90 % gehen für Vor- und Nachlauf, Umschlag und Zoll drauf."},{q:"Kohle, nicht eilig, große Menge, Werk am Rhein – welcher Verkehrsträger?",o:["Binnenschiff","Luftfracht","Lkw","Drohne"],c:0,e:"Massengut, kostensensibel, nicht eilig → Binnenschiff."},{q:"Was zählt NICHT zur Verkehrswertigkeit?",o:["Werbewirkung","Massenleistungsfähigkeit","Netzbildungsfähigkeit","Berechenbarkeit"],c:0,e:"Verkehrswertigkeit: Masse, Schnelligkeit, Netz, Berechenbarkeit, zeitl./räuml. Flexibilität, Sicherheit, Umwelt."},{q:"Ein Nachteil der Eisenbahn ist …",o:["feste Bindung an Fahrpläne und Schienennetz","Sonntagsfahrverbot","Abhängigkeit von Staus","geringe Massenleistung"],c:0,e:"Die Bahn ist unabhängig vom Straßenverkehr, aber starr."},{q:"Für welche Güter sind Rohrleitungen geeignet?",o:["flüssige und gasförmige Güter","Stückgut","Kühlware","Elektronik"],c:0,e:"Wasser, Erdöl, Erdgas – kontinuierlich gefördert und verbraucht."},{q:"Linienschifffahrt bedeutet …",o:["feste Routen und Fahrpläne","Schiff wird je nach Bedarf gechartert","nur Binnenschiffe","nur Gefahrgut"],c:0,e:"Trampschifffahrt = Charter nach Bedarf."}],

MODS_BL.push({id:"t4",tab:"4 Netzwerke & Touren",title:"Transportnetzwerke, Tourenplanung und Green Logistics",intro:"Clevere Netzwerke bündeln Sendungen: kombinierter Verkehr, Güterverkehrszentren, Hub-and-Spoke und City-Logistik. Außerdem: Wie plane ich die kürzeste Tour?",
topics:[
{t:"Kombinierter Verkehr",g:GB.kv,what:"<b>Kombinierter Verkehr</b> = Transport in <b>Ladungseinheiten</b> (Container, Wechselbrücke, Auflieger) mit nacheinander verschiedenen Verkehrsträgern; die Güter bleiben dabei in der Ladungseinheit. Im engeren Sinn läuft der lange Hauptlauf auf Schiene oder Schiff, Vor- und Nachlauf auf der Straße.",deep:"<p><b>Begleiteter</b> kombinierter Verkehr: Der ganze Lkw fährt auf dem Zug mit, der Fahrer begleitet (<b>rollende Landstraße</b>). <b>Unbegleitet</b>: Nur die Ladungseinheit (Container, Auflieger) wird umgeschlagen.</p><p>Transportkette: Q (Quelle) → Vorlauf → U1 → Hauptlauf → U2 → Nachlauf → Z (Ziel).</p>",merk:"Begleitet = Fahrer fährt mit · unbegleitet = nur die Kiste reist.",kl:"Begleitet/unbegleitet erklären können – mit Beispiel rollende Landstraße."},
{t:"Güterverkehrszentrum und Hub-and-Spoke",g:GB.hub,what:"Ein <b>GVZ</b> ist ein verkehrsgünstig gelegenes Gewerbegebiet, in dem Verkehrs-, Logistik- und Dienstleistungsunternehmen zusammenarbeiten. Es ist Systemwechselpunkt zwischen Schiene, Straße, Binnenschiff und zwischen Nah- und Fernverkehr. Merkmale: <b>Multimodalität, Multifunktionalität, Überregionalität</b>. Im <b>Hub-and-Spoke-System</b> sammeln Depots, ein zentraler <b>Hub</b> sortiert um, Depots verteilen.",merk:"GVZ = drei M-Wörter: multimodal, multifunktional, überregional."},
{t:"City-Logistik und Green Logistics",g:GB.city,what:"<b>City-Logistik</b> umfasst alle Tätigkeiten für eine nach Art, Menge, Zeit, Raum und Umwelt abgestimmte, effiziente Ver- und Entsorgung einer Stadt – Kern ist die <b>Bündelung</b> von Auslieferungstouren. <b>Green Logistics</b> steht für nachhaltige Konzepte: Routenoptimierung, Verlagerung auf umweltfreundliche Verkehrsträger, energieeffiziente Fahrzeuge, Energiesparen im Lager, effiziente Förderfahrzeuge, ökologisches Verpackungs- und Behältermanagement.",merk:"Bündeln statt Kolonnenverkehr."},
{t:"Tourenplanung",g:GB.tour,what:"<b>Tourenplanung</b> legt die <b>Anfahrtsreihenfolge</b> der Abladestellen fest – und damit die logische Beladung des Lkw. Zu beachten: pünktliche Belieferung bzw. Zeitfenster, Optimierung von Zeit und Route (km), Lenkzeiten, Kostenoptimum (Auslastung). Moderne Software hilft (Schnittstelle zum LVS, Sendungsverfolgung).",f:["Anzahl Touren bei n Kunden = n! = n × (n − 1) × … × 1","3 Kunden: 3 × 2 × 1 = 6 · 4 Kunden: 24 · 5 Kunden: 120"],ex:"Speyer → Schifferstadt (9) → Neustadt (19) → Landau (17) → Speyer (32) = <b>77 km</b>. Die umgekehrte Reihenfolge ist genauso lang. Alle anderen Touren: 89 oder 114 km.",deep:"<p>Warum nicht blind die kürzeste Tour nehmen? Zwei gleich lange Varianten sind rechnerisch gleich, praktisch zählen aber <b>Zeitfenster der Kunden</b>, Verkehrslage und Fahrzeit, Lenk- und Ruhezeiten, Straßenart und die <b>Beladungsreihenfolge</b> (was zuerst ausgeladen wird, wird zuletzt eingeladen).</p>",merk:"Kürzeste km ≠ immer beste Tour.",kl:"Rechenweg mit Tabelle aller Varianten aufschreiben; jede Tour und ihre Umkehrung sind gleich lang."}],
quiz:[{q:"Beim begleiteten kombinierten Verkehr …",o:["fährt der ganze Lkw mit Fahrer auf dem Zug mit","wird nur der Container umgeschlagen","fährt der Lkw die ganze Strecke","fliegt die Ware"],c:0,e:"Rollende Landstraße = begleitet."},{q:"Welches Merkmal gehört zum Güterverkehrszentrum?",o:["Multimodalität","Monopolstellung","Werkverkehr","Pick-by-Voice"],c:0,e:"Multimodalität, Multifunktionalität, Überregionalität."},{q:"Wie viele Tourvarianten gibt es ab Speyer bei 4 Kunden?",o:["24","12","16","120"],c:0,e:"4 × 3 × 2 × 1 = 24."},{q:"Wichtigstes Merkmal der City-Logistik?",o:["Bündelung der Auslieferungstouren","mehr Einzeltransporte","nur Lastenräder","Nachtfahrverbot"],c:0,e:"Bündeln reduziert Verkehr, Lärm und Abgase."},{q:"Was macht der Hub im Hub-and-Spoke-System?",o:["Er sortiert zentral um","Er produziert die Ware","Er lagert dauerhaft","Er verzollt"],c:0,e:"Depots sammeln, der Hub sortiert, Depots verteilen."},{q:"Warum ist die kürzeste Tour nicht immer die beste?",o:["Zeitfenster, Verkehr und Beladungsreihenfolge zählen auch","Kurze Touren sind verboten","Der Fahrer bestimmt die Route","Kürzere Touren kosten mehr Maut"],c:0,e:"Praxis: Anlieferzeiten, Stau, Lenkzeiten, LIFO-Beladung."}],
mem:[["rollende Landstraße","begleiteter KV"],["Container-Umschlag","unbegleiteter KV"],["GVZ","Systemwechselpunkt"],["Hub","zentraler Umschlagpunkt"],["City-Logistik","Touren bündeln"],["Green Logistics","nachhaltige Logistik"]],
seq:{t:"Transportkette im kombinierten Verkehr",items:["Quelle (Q)","Vorlauf per Lkw","Umschlag U1","Hauptlauf per Bahn/Schiff","Umschlag U2","Nachlauf per Lkw","Ziel (Z)"]},
calcs:["tour"],cards:[["Kombinierter Verkehr?","Transport in Ladungseinheiten über mehrere Verkehrsträger, Gut bleibt in der Einheit."],["GVZ – drei Merkmale?","Multimodalität, Multifunktionalität, Überregionalität."],["Formel Tourvarianten?","n! = n × (n − 1) × … × 1 (3 Kunden = 6)."],["Kriterien Tourenplanung?","Zeitfenster/Pünktlichkeit, Route und Zeit, Lenkzeiten, Kosten/Auslastung."],["Maßnahmen Green Logistics?","Routenoptimierung, Verlagerung auf Bahn/Schiff, effiziente Fahrzeuge, Energie sparen, ökologische Verpackung."]]});
MODS_BL.push({id:"t5",tab:"5 Gefahrgut",title:"Gefahrgut transportieren",intro:"Benzin, Akkus, Säuren: Gefährliche Güter brauchen besondere Regeln für Verpackung, Kennzeichnung und Transport.",
topics:[
{t:"Gefahrstoff oder Gefahrgut?",what:"Beides sind Materialien, von denen Gefahren für Sicherheit, Leben, Gesundheit, Tiere, Sachen und Umwelt ausgehen. <b>Gefahrstoff</b>: wenn sie verpackt, abgefüllt, <b>gelagert</b> oder <b>innerbetrieblich</b> transportiert werden (Gefahrstoffverordnung, Chemikaliengesetz). <b>Gefahrgut</b>: wenn sie auf Straße, Schiene, Wasser oder in der Luft <b>befördert</b> werden (Gefahrgutbeförderungsgesetz).",merk:"Im Betrieb = Gefahrstoff · unterwegs = Gefahrgut.",kl:"Abgrenzung mit Rechtsgrundlage nennen."},
{t:"Vorschriften",g:GB.vorschr,what:"Supranational gelten die UN-Empfehlungen. Europäisch: <b>ADR</b> (Straße), <b>RID</b> (Schiene), <b>IMDG-Code</b> (See), <b>IATA-DGR</b> (Luft). National: <b>GGBefG</b>, <b>GGVSEB</b>, <b>GGVSee</b>. Unternehmen, die am Gefahrguttransport beteiligt sind, müssen i. d. R. mindestens einen <b>Gefahrgutbeauftragten</b> schriftlich bestellen.",deep:"<p>Die Vorschriften regeln: welche Güter befördert werden dürfen, welche zusammen geladen werden dürfen (<b>Zusammenladeverbot</b>), Verpackung und Kennzeichnung, Bau, Ausrüstung, Prüfung und Kennzeichnung der Fahrzeuge, Verladung und Stauung, Verhalten während der Fahrt, Schulung des Personals und Bußgelder.</p><p>Werden bestimmte Mengen unterschritten (<b>Kleinmengen</b>), kann die Beförderung ganz oder teilweise freigestellt sein.</p>",merk:"Straße ADR · Schiene RID · See IMDG · Luft IATA."},
{t:"Kennzeichnung: Warntafel und Klassen",g:GB.kemler,what:"Gefahrguttransporte tragen ein <b>Gefahrstoffsymbol</b> und eine orange <b>Gefahrentafel</b>: oben die <b>Kemler-Zahl</b> (Art der Gefahr), unten die <b>UN-Nummer</b> (Stoff). Verdopplung einer Ziffer = Zunahme der Gefahr, ein <b>X</b> = Berührung mit Wasser verboten. Gefahrgüter werden in <b>9 Klassen</b> eingeteilt.",deep:GB.ziffern+GB.klassen+"<p>Die Fahrzeugbesatzung erhält <b>schriftliche Weisungen</b> in ihrer Sprache und in Farbe: Seite 1 Schutzausrüstung (Augenspülung, Schutzbrille, Warnweste, Handschuhe), Seite 2–3 Gefahreneigenschaften, Seite 4 Maßnahmen bei Unfall/Notfall.</p>",merk:"Oben „wie gefährlich“, unten „was genau“.",kl:"Kemler-Zahl deuten: X423 = reagiert gefährlich mit Wasser (X), entzündbar fest (4), Gas (2), entzündbare Flüssigkeit (3)."}],
quiz:[{q:"Benzinfässer stehen in der Lagerhalle. Sie sind rechtlich ein …",o:["Gefahrstoff","Gefahrgut","Stetigförderer","Sammelgut"],c:0,e:"Gelagert/innerbetrieblich = Gefahrstoff."},{q:"Welche Vorschrift gilt für Gefahrgut auf der Straße?",o:["ADR","RID","IMDG-Code","IATA-DGR"],c:0,e:"ADR = Straße, RID = Schiene."},{q:"Was steht unten auf der orangen Warntafel?",o:["UN-Nummer","Kemler-Zahl","Fahrername","Gewicht"],c:0,e:"Oben Gefahrnummer (Kemler), unten Stoffnummer (UN)."},{q:"Was bedeutet ein X vor der Kemler-Zahl?",o:["Berührung mit Wasser verboten","radioaktiv","explosiv","ätzend"],c:0,e:"X = keine Berührung mit Wasser."},{q:"Ziffer 8 in der Kemler-Zahl bedeutet …",o:["Ätzwirkung","Giftigkeit","Radioaktivität","Gas"],c:0,e:"6 giftig, 7 radioaktiv, 8 ätzend."},{q:"Gefahrgutklasse 3 umfasst …",o:["entzündbare flüssige Stoffe","Gase","explosive Stoffe","radioaktive Stoffe"],c:0,e:"Klasse 3: Benzin, Diesel, Farbe."},{q:"Wer muss i. d. R. einen Gefahrgutbeauftragten bestellen?",o:["Unternehmen, die am Gefahrguttransport beteiligt sind","nur Spediteure","nur Fluggesellschaften","niemand"],c:0,e:"Schriftliche Bestellung von mindestens einem Gefahrgutbeauftragten."}],
mem:[["ADR","Straße"],["RID","Schiene"],["IMDG-Code","See"],["IATA-DGR","Luft"],["Kemler-Zahl","Art der Gefahr"],["UN-Nummer","Stoffnummer"]],
sort:{t:"Gefahrgutklasse zuordnen",cats:["Klasse 2 Gase","Klasse 3 entzündbar flüssig","Klasse 8 ätzend","Klasse 9 verschiedene"],items:[["Propangas",0],["Wasserstoff",0],["Diesel",1],["Farbe",1],["Salzsäure",2],["ätzendes Desinfektionsmittel",2],["Lithiumbatterien",3],["Asbest",3]]},
calcs:[],cards:[["Gefahrstoff vs. Gefahrgut?","Gefahrstoff: lagern/innerbetrieblich (GefStoffV); Gefahrgut: Beförderung auf Verkehrswegen (GGBefG)."],["Vorschriften je Verkehrsträger?","Straße ADR, Schiene RID, See IMDG-Code, Luft IATA-DGR."],["Warntafel oben/unten?","Oben Kemler-Zahl (Gefahr), unten UN-Nummer (Stoff)."],["Schriftliche Weisungen – Inhalt?","S. 1 Schutzausrüstung, S. 2–3 Gefahreneigenschaften, S. 4 Maßnahmen bei Unfall."],["Was regeln Gefahrgutvorschriften?","erlaubte Güter, Zusammenladeverbot, Verpackung/Kennzeichnung, Fahrzeuge, Verladung, Fahrt, Schulung, Bußgelder."]]});
MODS_BL.push({id:"t6",tab:"6 Transportkosten",title:"Transportkosten, Eigen- oder Fremdtransport",intro:"Was kostet ein Transport, und lohnt sich der eigene Fuhrpark? Hier sitzen die meisten Rechenpunkte zum Transport.",
topics:[
{t:"Einflussfaktoren und Transportkostenberechnung",what:"Die Transportkosten hängen ab von: <b>Verkehrsmittel</b>, <b>Frachtvolumen</b> (Menge, Stellplätze), <b>Entfernung</b>, <b>Schnelligkeit</b>, <b>Einzel- oder Sammeltransport</b> und <b>besonderen Vorschriften</b> (Gefahrgut, Kühlung).",f:["Fracht Straße = Gewicht (t) × km × Satz (€/tkm)","Maut = km × Mautsatz (€/km)","Volumengewicht Luft = L × B × H (cm) ÷ 6.000 × Anzahl Packstücke","Berechnet wird das höhere: echtes Gewicht oder Volumengewicht"],ex:"Skript Straße: 15 t × 550 km × 0,40 €/tkm = 3.300 € + Versicherung 300 € + Zoll 75 € + Maut 550 km × 0,19 € = 104,40 € → <b>3.779,40 €</b>.<br>Skript Luft: 6 Paletten 120 × 80 × 100 cm → 120 × 80 × 100 ÷ 6.000 × 6 = <b>960 kg</b> Volumengewicht &gt; 600 kg echtes Gewicht → berechnet werden 960 kg × 1,80 €/kg = 1.728 €.",merk:"Luftfracht rechnet mit dem „gefühlten“ Gewicht, wenn die Ware sperrig ist."},
{t:"Fixe und variable Fuhrparkkosten",g:GB.fuhr,what:"<b>Fixe Kosten</b> ändern sich nicht mit der Fahrleistung (Leasing/Abschreibung, Versicherung, Kfz-Steuer, Fahrerlöhne, Verwaltung). <b>Variable Kosten</b> steigen mit den Kilometern (Kraftstoff, AdBlue, Maut, Reparatur, Wartung, Reifen).",f:["K = Kf + kv × x","Fixkosten je Einsatztag = Fixkosten pro Jahr ÷ Einsatztage","variable Kosten je km = Σ (Verbrauch je km × Preis)"],ex:"Unterrichtsaufgabe Fuhrpark: Leasing 1.288 € × 12 + Versicherung/Steuer 7.926 € + Lohn 2.800 € × 12 + 25 % Lohnnebenkosten + 210 € Fortbildung = 65.592 € + 10 % Verwaltungszuschlag = <b>72.151,20 €/Jahr</b> ÷ 240 Tage = <b>300,63 €/Tag</b>. Variabel: Diesel 0,390 + AdBlue 0,008 + Maut 0,080 + Service 0,030 + Reifen 0,006 = <b>0,514 €/km</b>.",merk:"Fix = steht auch, wenn der Lkw steht."},
{t:"Eigen- oder Fremdtransport",g:GB.kosten,what:"Der <b>Eigentransport</b> hat fixe und variable Kosten, der <b>Fremdtransport</b> grundsätzlich nur variable (ggf. eine feste Monatspauschale). Die <b>kritische Menge</b> ist die Fahrleistung, bei der beide gleich teuer sind. Darunter lohnt sich der Fremdtransport, darüber der Eigentransport.",f:["Kfremd = Kf,fremd + kv,fremd × x","Keigen = Kf,eigen + kv,eigen × x","kritische Menge: Kfremd = Keigen → x = (Kf,eigen − Kf,fremd) ÷ (kv,fremd − kv,eigen)"],ex:"Berechnungsbeispiel 3: 55 km × 2 × 12 = 1.320 km/Monat. Fremd: 1.300 + 1,90 × 1.320 = <b>3.808 €</b>. Eigen: 2.500 + 275 + 2.450 = 5.225 € fix + 0,30 × 1.320 = <b>5.621 €</b> → Fremdtransport günstiger. Kritisch: 1.300 + 1,9x = 5.225 + 0,3x → <b>x = 2.453,13 km</b>.",deep:table(["Vorteile Eigentransport","Vorteile Fremdtransport"],[["Weisungsrecht gegenüber dem Fahrer","kein Personalverwaltungsaufwand"],["direkter Kundenkontakt (Feedback)","kein Unfall- und Unterhaltsrisiko"],["Fahrer kennt Produkte und Kunden","keine Investitionen"],["Flexibilität für Extrafahrten","keine Leerfahrten"],["Zusatzdienste (Auspacken, Auffüllen)","hohe Kostentransparenz, Spezialisten"]])+"<p><b>Insourcing</b>: Bisher fremd vergebene Leistungen werden wieder im eigenen Betrieb erbracht (Gegenteil: Outsourcing).</p>",merk:"Wenig fahren → fremd · viel fahren → eigen.",kl:"Immer beide Kostenfunktionen aufstellen, gleichsetzen, nach x auflösen – und das Ergebnis in einem Satz interpretieren."}],
quiz:[{q:"Welche Kosten hat der Fremdtransport grundsätzlich?",o:["nur variable Kosten","nur fixe Kosten","keine Kosten","nur Personalkosten"],c:0,e:"Eigen: fix + variabel; fremd: grundsätzlich variabel."},{q:"Was ist die kritische Menge?",o:["Fahrleistung, bei der Eigen- und Fremdtransport gleich viel kosten","maximale Zuladung des Lkw","Mindestbestellmenge","Kapazitätsgrenze des Lagers"],c:0,e:"Ab dort kippt die Entscheidung."},{q:"Liegt die tatsächliche Fahrleistung unter der kritischen Menge, ist … günstiger.",o:["der Fremdtransport","der Eigentransport","beides gleich","keine Aussage möglich"],c:0,e:"Wenig fahren → die hohen Fixkosten lohnen sich nicht."},{q:"Welche Kosten sind variabel?",o:["Kraftstoff und Maut","Kfz-Steuer","Leasingrate","Versicherung"],c:0,e:"Kraftstoff, Maut, Reparatur, Wartung, Reifen."},{q:"Volumengewicht einer Palette 120 × 80 × 100 cm (Divisor 6.000)?",o:["160 kg","96 kg","600 kg","1.600 kg"],c:0,e:"960.000 ÷ 6.000 = 160 kg."},{q:"Was ist Insourcing?",o:["Fremd vergebene Leistungen wieder selbst erbringen","Leistungen an Dienstleister abgeben","Lager ins Ausland verlagern","Sammelladung organisieren"],c:0,e:"Gegenteil von Outsourcing."},{q:"Ein Vorteil des Eigentransports ist …",o:["Weisungsrecht gegenüber dem Fahrer","keine Investitionen","keine Leerfahrten","kein Unfallrisiko"],c:0,e:"Die anderen drei sind Vorteile des Fremdtransports."}],
mem:[["Leasingrate","fixe Kosten"],["Diesel","variable Kosten"],["Maut","variable Kosten"],["kritische Menge","Kosten gleich"],["Insourcing","wieder selbst machen"],["Volumengewicht","L × B × H ÷ 6.000"]],
sort:{t:"Fix oder variabel?",cats:["fixe Kosten","variable Kosten"],items:[["Leasingrate",0],["Kfz-Steuer",0],["Versicherung",0],["Fahrerlohn (fest angestellt)",0],["Diesel",1],["AdBlue",1],["Maut",1],["Reifenverschleiß",1]]},
calcs:["eigfremd","fuhrpark","insourcing","strasse","luft"],cards:[["Formel kritische Menge?","Kf,fremd + kv,fremd·x = Kf,eigen + kv,eigen·x → nach x auflösen."],["Einflussfaktoren Transportkosten?","Verkehrsmittel, Frachtvolumen, Entfernung, Schnelligkeit, Einzel-/Sammeltransport, Vorschriften."],["Volumengewicht Luftfracht?","L × B × H (cm) ÷ 6.000 je Packstück; das höhere Gewicht zählt."],["3 Vorteile Fremdtransport?","keine Investitionen, kein Personalaufwand, keine Leerfahrten, Kostentransparenz."],["3 Vorteile Eigentransport?","Weisungsrecht, Kundenkontakt, Flexibilität, Zusatzdienste, Fahrer kennt Produkte."]]});
MODS_BL.push({id:"t7",tab:"7 Incoterms 2020",title:"Incoterms 2020",intro:"Wer zahlt den Transport, und ab wann trägt der Käufer das Risiko? Die Incoterms der ICC regeln das mit elf Klauseln.",
topics:[
{t:"Bedeutung der Incoterms",what:"Die <b>Incoterms</b> (International Commercial Terms) der <b>ICC</b> Paris gibt es seit 1936, die aktuelle Fassung gilt seit <b>1. 1. 2020</b>. Sie sind weltweit anerkannte, einheitliche Lieferbedingungen und regeln <b>Kostenverteilung, Risikoverteilung (Gefahrübergang) und Sorgfaltspflichten</b>. Sie schaffen Klarheit und beugen Missverständnissen und teuren Streitigkeiten vor.",deep:"<p><b>Nicht</b> geregelt werden: Vertragsabschluss, Eigentumsübertragung, Zahlungsabwicklung und Rechtsfolgen von Vertragsbrüchen – dafür gilt der Kaufvertrag bzw. das zugrunde liegende Recht.</p><p><b>Hauptfunktionen</b>: Welche Verpflichtungen und welche Kosten jeder Vertragspartner für seine Wegstrecke trägt und wer welches Risiko abdeckt. <b>Nebenfunktionen</b>: Warendokumente und Zoll, Transportdokumente, Versicherung, Benachrichtigung, Warenprüfung, Verpackung.</p><p>Grundprinzip: Bis zum vereinbarten Übergabepunkt ist der Verkäufer zuständig, danach der Käufer.</p>",merk:"Incoterms = Kosten + Risiko + Pflichten – nicht Eigentum und Zahlung.",kl:"Die sieben Unterrichtsfragen zum IHK-Text sind typische Klausurfragen – siehe Karteikarten."},
{t:"Einteilung: Transportart und Gruppen",g:GB.incoGroups,what:"<b>Nach Transportart</b>: Für jede Transportart gelten EXW, FCA, CPT, CIP, DAP, DPU, DDP. Nur für See- und Binnenschiff: <b>FAS, FOB, CFR, CIF</b>. <b>Nach Abwicklung</b>: Gruppe E (Abholklausel), F (Haupttransport nicht vom Verkäufer bezahlt), C (Haupttransport vom Verkäufer bezahlt), D (Ankunftsklauseln). Innerhalb einer Gruppe gilt dasselbe Grundprinzip für Kosten und Gefahr; mit jeder Gruppe steigen die Pflichten des Verkäufers.",merk:"Schiffsklauseln haben ein S, A oder ein Schiff im Namen: FAS, FOB, CFR, CIF."},
{t:"Die elf Klauseln",g:GB.inco,what:"<b>EXW</b> ist die Minimalverpflichtung des Verkäufers (nur bereitstellen) – für den Käufer die ungünstigste. <b>DDP</b> ist die Maximalverpflichtung des Verkäufers – für den Käufer die günstigste. Besonders wichtig: Bei den <b>C-Klauseln</b> zahlt der Verkäufer den Haupttransport, die <b>Gefahr</b> geht aber schon bei der Übergabe an den Frachtführer bzw. an Bord auf den Käufer über.",deep:table(["Klausel","Gefahrübergang / Besonderheit"],[["EXW Ab Werk","Bereitstellung beim Verkäufer; Käufer muss auch die Ausfuhr erledigen"],["FCA Frei Frachtführer","Übergabe an den vom Käufer benannten Frachtführer; Verkäufer macht Ausfuhrfreimachung; gut für Container"],["FAS Frei Längsseite Schiff","Ware längsseits des Schiffs im Verschiffungshafen"],["FOB Frei an Bord","Ware an Bord des Schiffs im Verschiffungshafen"],["CFR Kosten und Fracht","an Bord; Verkäufer zahlt Fracht bis Bestimmungshafen"],["CIF … + Versicherung","wie CFR + Transportversicherung (Mindestdeckung ICC C)"],["CPT Frachtfrei","Übergabe an den ersten Frachtführer; Verkäufer zahlt bis Bestimmungsort"],["CIP … versichert","wie CPT + Versicherung (ICC A, volle Deckung)"],["DAP Geliefert benannter Ort","entladebereit am Bestimmungsort"],["DPU … entladen","am Bestimmungsort entladen"],["DDP Geliefert verzollt","wie DAP + Einfuhrverzollung durch den Verkäufer"]]),merk:"EXW = alles Käufer · DDP = alles Verkäufer · C = zahlt weit, haftet kurz.",kl:"Problem EXW: Darf im Exportland nur der Exporteur die Ausfuhr anmelden, kann der Käufer die Ware faktisch nicht ausführen → besser FCA."}],
quiz:[{q:"Wer gibt die Incoterms heraus?",o:["die Internationale Handelskammer (ICC) in Paris","die IHK Stuttgart","die EU-Kommission","die UN"],c:0,e:"ICC Paris, seit 1936."},{q:"Was regeln die Incoterms NICHT?",o:["Eigentumsübertragung","Kostenverteilung","Gefahrübergang","Sorgfaltspflichten"],c:0,e:"Nicht geregelt: Vertragsschluss, Eigentum, Zahlung, Vertragsbruch-Folgen."},{q:"Welche Klausel ist die Minimalverpflichtung des Verkäufers?",o:["EXW","DDP","FCA","CIF"],c:0,e:"EXW = reine Abholklausel."},{q:"Welche Klausel ist für den Käufer am günstigsten?",o:["DDP","EXW","FOB","CPT"],c:0,e:"DDP = Maximalverpflichtung des Verkäufers inkl. Einfuhrverzollung."},{q:"Welche Klausel gilt nur für den Schiffstransport?",o:["FOB","FCA","CPT","DAP"],c:0,e:"FAS, FOB, CFR, CIF sind Schiffsklauseln."},{q:"Bei CIF trägt der Käufer das Risiko ab …",o:["dem Zeitpunkt, an dem die Ware an Bord ist","Ankunft im Bestimmungshafen","Abholung im Werk","Verzollung"],c:0,e:"C-Gruppe: Verkäufer zahlt weit, Gefahr geht früh über."},{q:"Was ist das Problem der EXW-Klausel bei der Ausfuhr?",o:["Der Käufer muss die Ausfuhr erledigen, darf/kann es aber oft nicht","Der Verkäufer muss verzollen","Es gibt keine Versicherung","Sie gilt nur in der EU"],c:0,e:"Dann besser FCA verwenden."},{q:"CIP verpflichtet den Verkäufer zu einer Versicherung im Umfang von …",o:["ICC A (volle Deckung)","ICC C (Mindestdeckung)","gar keiner","50 % des Warenwerts"],c:0,e:"CIF: ICC C, CIP: ICC A."}],

MODS_BL.push({id:"l1",tab:"8 Lagerfunktionen",title:"Lagerfunktionen, vorratslose Versorgung, Anforderungen",intro:"Warum lagern wir überhaupt – und wie können wir Bestände vermeiden? Am Fall food&fun lernst du Lagerfunktionen, Just in time, Streckengeschäft und Cross-Docking.",
topics:[
{t:"Was ist ein Lager – und wozu?",g:GB.funktionen,what:"Ein <b>Lager</b> umfasst den Bestand an Gütern, die <b>noch nicht, nicht mehr oder vorübergehend nicht</b> am Produktionsprozess teilnehmen. Aufgaben: <b>Ausgleichs-, Sicherungs-, Spekulations-, Veredelungs- und Sortimentsfunktion</b>.",deep:"<p><b>Bezug food&amp;fun:</b> Ausgleich – Aktionsartikel kommen Wochen vor dem Verkaufsstart. Sicherung – Märkte bleiben bei Nachfrageschwankungen und Lieferproblemen versorgt (aktuell besonders wichtig). Spekulation – größere Mengen vor einer Preiserhöhung kaufen. Sortiment – Trockensortiment, Getränke und Aktionsware für die Märkte zusammenstellen. Veredelung – z. B. Nachreifen von Obst (im Trockensortiment kaum relevant).</p>",merk:"A-S-S-V-S: Ausgleich, Sicherung, Spekulation, Veredelung, Sortiment.",kl:"Funktion nennen, erklären und an der Ausgangssituation festmachen – so gibt es volle Punkte."},
{t:"Vorratslose Versorgung",g:GB.vorratslos,what:"<b>Just in time</b>: Lieferant liefert langfristig vereinbart genau zum Bedarfszeitpunkt in der benötigten Menge – Ziel bestandslose Versorgung. <b>Streckengeschäft</b>: Der Händler kauft, der Lieferant liefert direkt an den Kunden bzw. die Filiale. <b>Cross-Docking</b>: Ware wird im Zentrallager nicht eingelagert, sondern sofort den Filialen zugeordnet und weitertransportiert.",deep:table(["Just in time: Vorteile","Just in time: Nachteile"],[["vertrauensvolle Zusammenarbeit","große Abhängigkeit vom Lieferanten"],["geringere Bestandskosten","höhere Transportkosten (mehr Lieferungen)"],["weniger Lagerfläche","Qualitätsrisiko (keine Zeit für Eingangsprüfung)"],["kürzere Durchlaufzeit","mehr Verkehr, Umweltbelastung"],["bessere Qualität durch Prüfung beim Lieferanten","anfällig für Stau, Unfall, Streik"]])+"<p><b>Voraussetzungen JIT:</b> detailliertes Informations- und Planungssystem, kontinuierliche Qualitätssicherung, Know-how des Lieferanten.</p><p><b>Cross-Docking I</b>: vorkommissionierte Paletten werden nur umgeschlagen. <b>Cross-Docking II</b>: artikelreine Paletten werden im Umschlagpunkt auf die Filialen kommissioniert.</p><p><b>Fall food&amp;fun:</b> Getränkelieferant beliefert Märkte direkt = <b>Streckengeschäft</b>. Lieferant liefert genau zu vereinbarten Zeitpunkten bei exakter Planung = <b>Just in time</b>. Waren kommen ins Zentrallager, werden aber sofort zugeordnet = <b>Cross-Docking</b>.</p>",merk:"JIT = pünktlich · Strecke = am Lager vorbei · Cross-Docking = durchs Lager durch.",kl:"Fallaufgabe: Verfahren erkennen, Chancen und Risiken je Verfahren abwägen, eine Empfehlung begründen."},
{t:"Anforderungen an die Lagerhaltung",g:GB.anfo,what:"Ein Lager muss <b>ausreichende Kapazität</b>, eine <b>optimale Umschlagsleistung</b> und <b>Volumennutzung</b> bieten, die <b>Bestandssicherheit</b> (Buchbestand = Istbestand) und <b>Betriebssicherheit</b> (Störfallkonzept) gewährleisten und die <b>Sicherheit im Lager</b> (Unfallverhütung, Brandschutz, Gefahrstoffe, Warenqualität) sicherstellen.",merk:"Kapazität, Umschlag, Volumen, Bestand, Betrieb, Sicherheit."}],
quiz:[{q:"Welche Lagerfunktion schützt vor Lieferverzögerungen und Nachfrageschwankungen?",o:["Sicherungsfunktion","Spekulationsfunktion","Veredelungsfunktion","Sortimentsfunktion"],c:0,e:"Sicherung = Puffer gegen Unvorhersehbares."},{q:"Käse reift im Lager. Welche Funktion ist das?",o:["Veredelungsfunktion","Ausgleichsfunktion","Sicherungsfunktion","Sortimentsfunktion"],c:0,e:"Veredelung: Reifen, Gären, Trocknen."},{q:"Ein Lieferant liefert direkt an den Kunden des Händlers. Das heißt …",o:["Streckengeschäft","Cross-Docking","Just in time","Konsignationslager"],c:0,e:"Die Ware läuft nicht durchs Lager des Händlers."},{q:"Beim Cross-Docking wird die Ware …",o:["sofort umgeschlagen statt eingelagert","beim Lieferanten gelagert","vom Kunden abgeholt","im Hochregal gelagert"],c:0,e:"Umschlag ohne Einlagerung."},{q:"Ein Nachteil von Just in time ist …",o:["Anfälligkeit für Stau, Unfall, Streik","höhere Lagerkosten","mehr Lagerfläche","längere Durchlaufzeit"],c:0,e:"Kein Puffer – Störungen treffen sofort."},{q:"Was bedeutet Bestandssicherheit?",o:["Buchbestand stimmt mit dem tatsächlichen Bestand überein","Lager ist immer voll","Ware ist versichert","Lager ist abgeschlossen"],c:0,e:"Übereinstimmung buchmäßig ↔ physisch."},{q:"Welche Voraussetzung braucht Just in time?",o:["detailliertes Informations- und Planungssystem","großes Sicherheitslager","Streckengeschäft","Pick-by-Voice"],c:0,e:"Außerdem Qualitätssicherung und Know-how des Lieferanten."}],

MODS_BL.push({id:"l2",tab:"9 Wareneingang",title:"Wareneingang und Einlagerung",intro:"Die Warenannahme entscheidet, ob Rechte gegenüber Lieferant und Frachtführer gesichert sind. Die Reihenfolge der Prüfschritte ist Klausurstoff.",
topics:[
{t:"Prüfung in Anwesenheit des Frachtführers",g:GB.eingang,what:"Noch bevor abgeladen wird, prüft man im Beisein des Frachtführers: <b>1.</b> Ist die Ware für uns bestimmt? (sonst nicht annehmen) <b>2.</b> Haben wir sie bestellt? (sonst ablehnen oder unter Vorbehalt annehmen) <b>3.</b> Kam sie rechtzeitig? (sonst ggf. Schadenersatz; Verspätung dem Frachtführer innerhalb von <b>21 Tagen</b> anzeigen). Beim Abladen: <b>4.</b> äußere Beschädigungen, <b>5.</b> Anzahl der Colli laut Versandpapieren.",deep:"<p><b>Beschädigung</b>: je nach Vereinbarung Annahme verweigern oder vom Fahrer auf den Frachtpapieren bestätigen lassen (Tatbestandsaufnahme); Transportschaden dem Frachtführer innerhalb von <b>7 Tagen</b> melden.</p><p><b>Mehrlieferung</b>: vom Fahrer bestätigen lassen, evtl. Mehrmenge ablehnen. <b>Minderlieferung</b>: vom Fahrer bestätigen lassen, ggf. Nachlieferung. Ist alles in Ordnung: <b>Empfangsbestätigung</b> auf den Frachtpapieren und ggf. <b>Palettentausch</b>.</p>",merk:"Erst prüfen, dann quittieren – die Unterschrift ist ein Beweis.",kl:"Fall food&fun: 86 statt 80 Kartons → Mehrlieferung vom Fahrer bestätigen lassen, Mehrmenge ablehnen oder nach Rücksprache annehmen. 4 beschädigte Kartons → Vermerk auf den Frachtpapieren (Tatbestandsaufnahme), ggf. Annahme dieser Kartons verweigern, Frachtführer informieren."},
{t:"Nach Abfahrt: genaue Prüfung und Einlagerung",g:GB.fristen,what:"Nach Abfahrt des Frachtführers wird die Ware auf einer Stellfläche im Wareneingang <b>unverzüglich</b> (ggf. per Stichprobe) geprüft: <b>Identität, Qualität, Quantität, Beschaffenheit</b>. Dann folgen Wareneingangspapiere (Meldung an Einkauf, Zugangsbuchung, Lagerplatz), Kennzeichnung (Artikel-Nr., Stellplatz) und Einlagerung.",deep:"<p>Bei Mängeln: <b>unverzüglich reklamieren</b>, beanstandete Ware aufbewahren. Rechte gegenüber dem Lieferer: <b>Nacherfüllung</b> (ggf. mit Nachfrist), <b>Minderung</b>, <b>Schadenersatz</b> und/oder <b>Rücktritt</b>.</p><p><b>Versteckte Mängel</b> (erst später entdeckt): unverzüglich nach Entdeckung anzeigen, jedoch innerhalb von <b>2 Jahren</b>. Fall food&amp;fun: Qualitätsmangel zwei Tage nach Einlagerung entdeckt → sofort beim Lieferanten rügen, Ware separieren und aufbewahren, Nacherfüllung verlangen.</p>",merk:"I-Q-Q-B: Identität, Qualität, Quantität, Beschaffenheit.",kl:"Ablauf der Warenannahme als Schrittfolge vom Eintreffen des Frachtführers bis zur Einlagerung darstellen (Aufgabe 4 food&fun)."}],

MODS_BL.push({id:"l3",tab:"10 Kommissionierung",title:"Kommissionierung",intro:"Kommissionieren = Aufträge zusammenstellen. Welche Strategie ist die beste? Das hängt vom Sortiment, der Auftragsstruktur und dem Budget ab.",
topics:[
{t:"Begriff und Bereitstellung",g:GB.bereit,what:"<b>Kommissionieren</b> ist das Zusammenstellen von Teilmengen (Artikeln) aus einer Gesamtmenge (Sortiment) aufgrund von Aufträgen (<b>VDI 3590</b>) – aus dem lagerspezifischen wird ein verbrauchsspezifischer Zustand. Kommission = Auftrag, Kommissionierer = Picker. <b>Mann-zur-Ware</b> (statisch): der Picker geht zum Fach. <b>Ware-zum-Mann</b> (dynamisch): automatische Bereitstellung am Kommissionierplatz.",deep:"<p><b>Mann-zur-Ware</b> ist vorteilhaft bei geringem Investitionsbudget, kurzer Entnahmezeit und für Eilaufträge – Nachteil: zum Teil erhebliche Wegezeiten (food&amp;fun: 40 % der Arbeitszeit!).</p><p><b>Ware-zum-Mann</b>: hohe Kommissionierleistung, geringere Fehlerquote, ergonomischer Arbeitsplatz – aber hohe Investition, weniger flexibel bei Nachfrageschwankungen, Stillstand bei Maschinenausfall.</p>",merk:"Mann läuft = billig, langsam · Ware kommt = schnell, teuer.",kl:"Entscheidungsfragen: Investitionsbereitschaft, Auftragsstruktur, Fehlerquote, Flexibilität abwägen."},
{t:"Kommissionierinformationen",g:GB.pick,what:"Herkömmlich arbeitet man mit <b>Papier</b> (Pickliste). <b>Beleglos</b> kommen die Daten über EDV, Scanner oder Monitor. Optisch unterstützt: <b>Pick-by-Light</b> (Lampe am Fach). Sprachgesteuert: <b>Pick-by-Voice</b> (Headset) – Hände frei, sofortige Pick-Bestätigung, Rückfragen möglich, bis zu 15 % mehr Produktivität und deutlich weniger Fehler.",merk:"Licht zeigt, Stimme sagt, Papier vergisst."},
{t:"Organisation des Kommissionierens",g:GB.orga,what:"<b>Auftragsorientiert-seriell</b> (einstufig): Ein Picker arbeitet einen Auftrag nacheinander durch alle Lagerzonen ab, ggf. mit <b>Übergabestellen</b> zwischen den Zonen. <b>Auftragsorientiert-parallel</b>: Der Auftrag wird in Teilaufträge je Zone zerlegt und parallel gepickt, dann zusammengeführt. <b>Serienorientiert-parallel</b> (zweistufig): Stufe 1 sammelt Artikel für viele Aufträge, Stufe 2 verteilt sie auf die einzelnen Aufträge.",deep:"<p><b>Wegstrategie</b>: Bei der <b>Stichgangstrategie</b> geht der Picker in einen Gang hinein und kehrt am Ende um. Ziel jeder Wegstrategie: kurze Laufwege.</p><p><b>Pick-and-Pack</b>: Kommissionieren und Verpacken in einem Schritt direkt am Regal. Vorteilhaft, wenn Produkte schon kundengerecht verpackt sind, keine Spezialverpackung nötig ist und das Packmittel vorher feststeht (typisch: Online-Handel).</p>",merk:"seriell = einer läuft alles · parallel = Teams pro Zone · zweistufig = erst sammeln, dann verteilen."},
{t:"Strategie wählen: Fallbeispiele",what:"<b>Discounter</b> (1.500 Artikel, große Mengen, Kostendruck): einfache, kostengünstige Lösung, z. B. Mann-zur-Ware mit Pick-by-Voice, Schnelldreher nah an den Versand. <b>Online-Shop</b> (25.000 Artikel, viele kleine Aufträge): zweistufig bzw. Ware-zum-Mann mit Pick-and-Pack, skalierbar. <b>Ersatzteillager</b> (ähnliche Teile, Fehler fatal): beleglos mit Scan-Kontrolle, Pick-by-Light, Schulung. <b>Start-up</b>: günstige Papier- oder Scanner-Lösung, die später erweiterbar ist. <b>Supermarkt-Zentrallager</b> (Frische + Trocken): getrennte Zonen, Frische zuerst und schnell (FiFo), parallel kommissionieren.",deep:"<p><b>Fall food&amp;fun</b> (25 Märkte, 40 % Wegezeit, 3,2 % Fehler, +20 % Wachstum, keine Flächenerweiterung, keine Vollautomatisierung gewünscht): Schwachstellen = lange Wege, Papierbelege, keine Steuerung für Eilaufträge, keine Unterscheidung nach Umschlaghäufigkeit. Sinnvoll: <b>ABC-Zonierung</b> (Schnelldreher in Versandnähe), Wechsel auf <b>Pick-by-Voice oder Scanner</b>, Zonenkommissionierung bzw. Übergabestellen, eine Expressspur für Eilaufträge, Prüfung am Packplatz.</p><p><b>Kennzahlen zur Erfolgskontrolle</b>: Fehlerquote (Fehler ÷ Positionen × 100), Pickleistung (Positionen je Stunde), Wegezeitanteil, Auftragsdurchlaufzeit, Lieferbereitschaftsgrad.</p>",merk:"Erst Ziel klären (Kosten, Tempo, Fehler), dann Technik wählen.",kl:"Zielkonflikt nennen: Kosten ↔ Geschwindigkeit ↔ Qualität."}],
quiz:[{q:"Wer definiert das Kommissionieren?",o:["VDI 3590","HGB § 238","ADR","ICC"],c:0,e:"VDI-Richtlinie 3590."},{q:"Mann-zur-Ware heißt auch …",o:["statische Bereitstellung","dynamische Bereitstellung","Cross-Docking","Pick-and-Pack"],c:0,e:"Der Picker geht zur Ware = statisch."},{q:"Größter Nachteil von Mann-zur-Ware?",o:["lange Wegezeiten","hohe Investitionskosten","Stillstand bei Maschinenausfall","geringe Flexibilität"],c:0,e:"Die anderen drei sind Nachteile von Ware-zum-Mann."},{q:"Vorteil von Pick-by-Voice?",o:["Hände frei und sofortige Bestätigung","keine Investition","kein Strom nötig","keine Schulung"],c:0,e:"Bis zu 15 % mehr Produktivität, weniger Fehler."},{q:"Zweistufige Kommissionierung heißt auch …",o:["serienorientiert-parallel","auftragsorientiert-seriell","Stichgangstrategie","Mann-zur-Ware"],c:0,e:"Stufe 1 sammeln, Stufe 2 verteilen."},{q:"Wann lohnt Pick-and-Pack?",o:["wenn Produkte bereits kundengerecht verpackt sind","bei Spezialverpackungen","bei Schüttgut","nur im Freilager"],c:0,e:"Und wenn das Packmittel vorher feststeht."},{q:"Welche Kennzahl misst die Kommissionierqualität?",o:["Fehlerquote","Umsatz je Markt","Lagerfläche","Lkw-Anzahl"],c:0,e:"Fehler ÷ kommissionierte Positionen × 100."}],

calcs:["kommiss"],cards:[["Definition Kommissionieren?","Zusammenstellen von Teilmengen aus einer Gesamtmenge aufgrund von Aufträgen (VDI 3590)."],["Mann-zur-Ware: Vor-/Nachteil?","+ geringe Investition, Eilaufträge · − lange Wegezeiten."],["Ware-zum-Mann: Vor-/Nachteil?","+ hohe Leistung, wenig Fehler · − teuer, unflexibel, Stillstand bei Ausfall."],["Drei Organisationsformen?","auftragsorientiert-seriell, auftragsorientiert-parallel, serienorientiert-parallel (zweistufig)."],["Drei Kennzahlen Kommissionierung?","Fehlerquote, Pickleistung (Positionen/h), Wegezeitanteil, Durchlaufzeit."]]});

tour:{why:"Ein Disponent sucht die Reihenfolge mit den wenigsten Kilometern. Bei wenigen Kunden schreibt man einfach alle Möglichkeiten auf – das sind erstaunlich viele, denn sie wachsen mit jeder Station.",f:[["Wie viele Kunden kannst du zuerst anfahren? Und danach?","Anzahl = 3 × 2 × 1",0],["Rechne für jede Reihenfolge Start → Kunde 1 → Kunde 2 → Kunde 3 → zurück.","km = Summe der vier Teilstrecken",1],["Welche Reihenfolge hatte die kleinste Summe? Gib die drei Kunden in dieser Reihenfolge ein.","kürzeste Tour = Minimum",2],["Ein Kunde mehr: Wie viele Möglichkeiten für den ersten, zweiten … Kunden?","4 × 3 × 2 × 1",3],["Und mit fünf Kunden?","5 × 4 × 3 × 2 × 1",4]]},

var c=t.closest&&t.closest(".done-l");if(!c)return;var card=t.closest(".card"),id=card.getAttribute("data-t"),was=!!S.t[id];S.t[id]=t.checked;card.classList.toggle("done",t.checked);save();if(t.checked&&!was)addXP(5,"Thema gelernt");else refresh();checkBadges();});
